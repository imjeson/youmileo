<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>优米Leo看世界 - Nara Park</title>
<style>
  :root {
    --cream:#fff8e8; --sky:#ccecff; --grass:#b7df92; --ink:#354d50;
    --card:#fffffb; --accent:#e35f55; --soft:#ffe2a9;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 10% 10%, #fff4bc 0, transparent 25%), linear-gradient(135deg,#e4f8ff,#fff3e0 60%,#f6ffe8);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
    color:var(--ink);
  }
  .stage { width:min(1100px, 96vw); aspect-ratio: 16/10; border-radius:28px; overflow:hidden; background:#fff; box-shadow:0 22px 70px rgba(62,78,79,.22); position:relative; }
  .scene { position:absolute; inset:0; opacity:0; pointer-events:none; transform:translateX(20px); transition:opacity .55s ease, transform .55s ease; background:linear-gradient(#cfedfb 0 68%, #b4df91 68%); }
  .scene.active { opacity:1; pointer-events:auto; transform:translateX(0); }
  svg { width:100%; height:72%; display:block; }
  .topbar { position:absolute; left:28px; top:22px; right:28px; z-index:5; display:flex; justify-content:space-between; align-items:center; }
  .brand { background:rgba(255,255,255,.86); border:2px solid rgba(232,195,122,.75); padding:10px 18px; border-radius:999px; font-weight:800; letter-spacing:.5px; }
  .pageNo { width:54px; height:54px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.92); border:2px solid #e8c37a; font-weight:800; }
  .textcard { position:absolute; left:34px; right:34px; bottom:26px; min-height:25%; background:rgba(255,255,251,.95); border:2px solid #ead6a5; border-radius:26px; padding:24px 32px 18px; box-shadow:0 8px 22px rgba(99,80,43,.12); }
  .en { font-size:clamp(25px, 3vw, 43px); font-weight:900; line-height:1.08; margin-bottom:10px; }
  .cn { font-size:clamp(15px, 1.6vw, 22px); line-height:1.45; }
  .q { margin-top:10px; display:inline-block; background:#eefaff; border:1.5px solid #b8dbe9; border-radius:16px; padding:8px 14px; font-size:clamp(14px, 1.4vw, 19px); }
  .controls { position:absolute; z-index:10; right:28px; bottom:28px; display:flex; gap:10px; align-items:center; }
  button { border:0; border-radius:999px; background:#ffffff; color:var(--ink); font-weight:800; padding:11px 16px; box-shadow:0 6px 16px rgba(0,0,0,.12); cursor:pointer; }
  button:hover { transform:translateY(-1px); }
  .play { background:#ffda78; }
  .cloud { animation: drift 12s linear infinite alternate; }
  .cloud.slow { animation-duration:18s; }
  .deer { animation: bob 2.2s ease-in-out infinite; transform-origin:center bottom; }
  .kid { animation: wave 2.4s ease-in-out infinite; transform-origin:center bottom; }
  .dad { animation: nod 3.2s ease-in-out infinite; transform-origin:center bottom; }
  .leaf { animation: leaf 5s ease-in-out infinite; transform-origin:center; }
  .sparkle { animation: twinkle 1.5s ease-in-out infinite; transform-origin:center; }
  .water { animation: shimmer 3s ease-in-out infinite; }
  @keyframes drift { from { transform:translateX(-16px); } to { transform:translateX(26px); } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes wave { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(-1.8deg); } }
  @keyframes nod { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(1.2deg); } }
  @keyframes leaf { 0%,100% { transform:rotate(-8deg) translateY(0); } 50% { transform:rotate(12deg) translateY(8px); } }
  @keyframes twinkle { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.15); } }
  @keyframes shimmer { 0%,100% { opacity:.55; } 50% { opacity:.95; } }
  @media (max-width:760px) { .stage { aspect-ratio: 9/14; } svg { height:58%; } .textcard { min-height:35%; padding:18px; } .controls { right:18px; bottom:16px; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="topbar"><div class="brand">优米Leo看世界 · Nara Park</div><div class="pageNo" id="pageNo">01</div></div>
  <div id="slides"></div>
  <div class="controls">
    <button id="prevBtn">上一页</button>
    <button class="play" id="playBtn">暂停</button>
    <button id="nextBtn">下一页</button>
  </div>
</div>
<script>
const pages = [{'num': 1, 'en': 'Today we visit Nara Park.', 'cn': '今天，我们来到日本奈良的一座大公园。这里有树、有小路，还有会慢慢靠近游客的小鹿。', 'q': '你觉得在公园里，最先会遇到谁？', 'scene': 'gate'}, {'num': 2, 'en': 'Gentle deer walk freely here.', 'cn': '奈良公园里的鹿可以在草地和路边自由走动。它们看起来很亲近人，但仍然是野生动物。', 'q': '如果小鹿走到你身边，你会怎么打招呼？', 'scene': 'deer_walk'}, {'num': 3, 'en': 'We use calm hands and soft voices.', 'cn': '和小鹿相处时，我们不追、不吓、不大叫。安静一点，小鹿和孩子都会更安心。', 'q': '为什么温柔的声音会让动物更放松？', 'scene': 'calm'}, {'num': 4, 'en': 'Deer crackers are special treats.', 'cn': '如果想喂鹿，要买专门的鹿仙贝。不要把糖果、面包或自己的零食给小鹿吃。', 'q': '为什么动物不能随便吃人类的零食？', 'scene': 'crackers'}, {'num': 5, 'en': 'A deer may bow for a cracker.', 'cn': '有些小鹿会低下头，好像在鞠躬要饼干。我们也可以礼貌地微笑，但要一片一片快快喂。', 'q': '如果你和小鹿互相鞠躬，你想说什么？', 'scene': 'bow'}, {'num': 6, 'en': 'Big temples stand near the trees.', 'cn': '公园旁有古老的寺庙，比如东大寺。高高的屋顶和安静的树，让人感觉走进了很久以前的故事。', 'q': '你见过很大的木头建筑吗？它给你什么感觉？', 'scene': 'temple'}, {'num': 7, 'en': 'Stone lanterns line the shrine path.', 'cn': '通往春日大社的路上，有很多石灯笼。走在树荫里，就像沿着一条安静的故事小路前进。', 'q': '如果石灯笼会说话，它可能讲什么故事？', 'scene': 'lanterns'}, {'num': 8, 'en': 'Ponds reflect pagodas and sky.', 'cn': '池塘像一面小镜子，把塔、树和天空都照进去。孩子可以停下来，看看水里的另一个世界。', 'q': '你在水面倒影里，看见过什么有趣的东西？', 'scene': 'pond'}, {'num': 9, 'en': 'We keep the park clean and kind.', 'cn': '在奈良公园，我们收好纸袋和地图，不乱丢垃圾，也不让小鹿咬到不该吃的东西。', 'q': '你能想到哪些保护公园的小行动？', 'scene': 'clean'}, {'num': 10, 'en': 'Nara Park becomes a gentle memory.', 'cn': '离开时，我们记住小鹿的眼睛、树下的风和慢慢走路的感觉。旅行不是赶路，而是好好看见。', 'q': '如果把今天画成一张明信片，你会画什么？', 'scene': 'memory'}];
let current = 0;
let playing = true;
let timer = null;

function deer(x,y,s=1,bow=false) {
  const headY = bow ? 58 : 0;
  return `<g class="deer" transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="95" cy="122" rx="85" ry="44" fill="#c1874e" stroke="#6e4a31" stroke-width="5"/>
    <circle cx="70" cy="110" r="6" fill="#f5d99f"/><circle cx="105" cy="98" r="6" fill="#f5d99f"/><circle cx="137" cy="120" r="6" fill="#f5d99f"/>
    <rect x="42" y="150" width="22" height="78" rx="10" fill="#704a31"/><rect x="138" y="150" width="22" height="78" rx="10" fill="#704a31"/>
    <ellipse cx="12" cy="115" rx="18" ry="15" fill="#f6dcae" stroke="#6e4a31" stroke-width="3"/>
    <path d="M155 92 C192 85, 205 92, 222 ${86+headY}" fill="none" stroke="#c1874e" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="238" cy="${62+headY}" rx="45" ry="38" fill="#c1874e" stroke="#6e4a31" stroke-width="5"/>
    <path d="M215 ${45+headY} L198 ${20+headY} L228 ${35+headY}" fill="#c1874e" stroke="#6e4a31" stroke-width="4"/>
    <path d="M258 ${45+headY} L280 ${22+headY} L268 ${58+headY}" fill="#c1874e" stroke="#6e4a31" stroke-width="4"/>
    <path d="M228 ${30+headY} L212 ${0+headY} M212 ${0+headY} L194 ${-12+headY} M254 ${30+headY} L268 ${0+headY} M268 ${0+headY} L287 ${-12+headY}" stroke="#704a31" stroke-width="5" stroke-linecap="round"/>
    <circle cx="230" cy="${63+headY}" r="5" fill="#202428"/><circle cx="252" cy="${64+headY}" r="5" fill="#202428"/>
    <ellipse cx="242" cy="${78+headY}" rx="9" ry="6" fill="#3c2b24"/>
  </g>`;
}
function kid(x,y,s=1) {
  return `<g class="kid" transform="translate(${x} ${y}) scale(${s})">
    <rect x="45" y="128" width="23" height="60" rx="10" fill="#3f5f99"/><rect x="88" y="128" width="23" height="60" rx="10" fill="#3f5f99"/>
    <ellipse cx="55" cy="190" rx="24" ry="11" fill="#3c3a38"/><ellipse cx="102" cy="190" rx="24" ry="11" fill="#3c3a38"/>
    <rect x="24" y="77" width="112" height="75" rx="30" fill="#ffb8c8" stroke="#98566a" stroke-width="3"/>
    <path d="M30 92 L0 62" stroke="#ffd6bd" stroke-width="13" stroke-linecap="round"/><circle cx="-5" cy="57" r="11" fill="#ffd6bd"/>
    <path d="M128 94 L168 82" stroke="#ffd6bd" stroke-width="13" stroke-linecap="round"/><circle cx="174" cy="80" r="11" fill="#ffd6bd"/>
    <circle cx="80" cy="45" r="45" fill="#ffd6bd" stroke="#9d6552" stroke-width="3"/>
    <path d="M40 38 C48 -5, 124 -8, 135 38 C103 21, 78 25, 53 42" fill="#443633"/>
    <circle cx="62" cy="53" r="8" fill="#24313a"/><circle cx="98" cy="53" r="8" fill="#24313a"/>
    <circle cx="65" cy="50" r="3" fill="white"/><circle cx="101" cy="50" r="3" fill="white"/>
    <path d="M70 72 Q80 84 94 72" fill="none" stroke="#914a56" stroke-width="3" stroke-linecap="round"/>
  </g>`;
}
function dad(x,y,s=1) {
  return `<g class="dad" transform="translate(${x} ${y}) scale(${s})">
    <rect x="45" y="145" width="26" height="72" rx="10" fill="#43566c"/><rect x="100" y="145" width="26" height="72" rx="10" fill="#43566c"/>
    <ellipse cx="56" cy="218" rx="28" ry="12" fill="#373737"/><ellipse cx="115" cy="218" rx="28" ry="12" fill="#373737"/>
    <rect x="20" y="78" width="132" height="86" rx="34" fill="#6aa1bf" stroke="#32607b" stroke-width="3"/>
    <path d="M25 95 L-20 62" stroke="#f2c49e" stroke-width="14" stroke-linecap="round"/><circle cx="-27" cy="58" r="12" fill="#f2c49e"/>
    <path d="M145 95 L195 72" stroke="#f2c49e" stroke-width="14" stroke-linecap="round"/><circle cx="202" cy="68" r="12" fill="#f2c49e"/>
    <circle cx="86" cy="45" r="48" fill="#f2c49e" stroke="#8f5a48" stroke-width="3"/>
    <path d="M45 36 C54 -5 130 -8 143 37 L50 47 Z" fill="#332d2a"/>
    <circle cx="67" cy="52" r="11" fill="none" stroke="#22303a" stroke-width="3"/><circle cx="105" cy="52" r="11" fill="none" stroke="#22303a" stroke-width="3"/><line x1="78" y1="52" x2="94" y2="52" stroke="#22303a" stroke-width="3"/>
    <circle cx="67" cy="53" r="3" fill="#22303a"/><circle cx="105" cy="53" r="3" fill="#22303a"/>
    <path d="M74 72 Q86 84 101 72" fill="none" stroke="#80414c" stroke-width="3" stroke-linecap="round"/>
  </g>`;
}
function temple(x,y,s=1) {
 return `<g transform="translate(${x} ${y}) scale(${s})">
  <rect x="80" y="190" width="380" height="75" fill="#c9a977" stroke="#5e4333" stroke-width="5"/>
  <path d="M40 188 L500 188 L440 135 L100 135 Z" fill="#46515a" stroke="#25282c" stroke-width="5"/>
  <path d="M90 135 L450 135 L390 90 L150 90 Z" fill="#46515a" stroke="#25282c" stroke-width="5"/>
  <path d="M160 90 L380 90 L340 50 L200 50 Z" fill="#46515a" stroke="#25282c" stroke-width="5"/>
  <rect x="125" y="195" width="28" height="70" fill="#734b32"/><rect x="205" y="195" width="28" height="70" fill="#734b32"/><rect x="285" y="195" width="28" height="70" fill="#734b32"/><rect x="365" y="195" width="28" height="70" fill="#734b32"/>
  <circle cx="270" cy="222" r="32" fill="#b68651"/><rect x="250" y="238" width="40" height="30" fill="#b68651"/>
 </g>`;
}
function torii(x,y,s=1) {
 return `<g transform="translate(${x} ${y}) scale(${s})">
  <rect x="80" y="70" width="28" height="225" fill="#d64e3f" stroke="#7c302b" stroke-width="4"/>
  <rect x="320" y="70" width="28" height="225" fill="#d64e3f" stroke="#7c302b" stroke-width="4"/>
  <rect x="50" y="94" width="330" height="36" fill="#d64e3f" stroke="#7c302b" stroke-width="4"/>
  <rect x="30" y="45" width="370" height="35" fill="#d64e3f" stroke="#7c302b" stroke-width="4"/>
  <rect x="105" y="130" width="220" height="27" fill="#d64e3f" stroke="#7c302b" stroke-width="4"/>
 </g>`;
}
function lantern(x,y,s=1) {
 return `<g transform="translate(${x} ${y}) scale(${s})">
  <rect x="35" y="95" width="25" height="120" fill="#8d9185" stroke="#585d56" stroke-width="3"/>
  <rect x="20" y="72" width="58" height="28" fill="#8d9185" stroke="#585d56" stroke-width="3"/>
  <rect x="28" y="35" width="42" height="42" fill="#ffe58c" stroke="#585d56" stroke-width="3"/>
  <path d="M12 36 L86 36 L66 10 L30 10 Z" fill="#8d9185" stroke="#585d56" stroke-width="3"/>
 </g>`;
}
function pagoda(x,y,s=1) {
 let tiers='';
 for(let i=0;i<5;i++){ let yy=i*48, w=230-i*18; tiers += `<path d="M${150-w/2} ${yy+50} L${150+w/2} ${yy+50} L${150+w*.42} ${yy+25} L${150-w*.42} ${yy+25} Z" fill="#43505e" stroke="#222" stroke-width="4"/><rect x="${150-w*.26}" y="${yy+50}" width="${w*.52}" height="38" fill="#b55545" stroke="#684336" stroke-width="3"/>`; }
 return `<g transform="translate(${x} ${y}) scale(${s})">${tiers}<line x1="150" y1="-30" x2="150" y2="25" stroke="#604335" stroke-width="5"/><path d="M150 -48 L132 -25 L168 -25 Z" fill="#ffda78" stroke="#604335" stroke-width="3"/></g>`;
}
function baseScene(extra) {
 return `<svg viewBox="0 0 1100 620" aria-hidden="true"><rect width="1100" height="620" fill="#ccecff"/><rect y="420" width="1100" height="220" fill="#b7df92"/><ellipse cx="160" cy="460" rx="260" ry="100" fill="#9fd683"/><ellipse cx="930" cy="452" rx="300" ry="110" fill="#9bd181"/><circle cx="985" cy="80" r="38" fill="#ffe08a"/><g class="cloud"><ellipse cx="120" cy="95" rx="48" ry="24" fill="white"/><ellipse cx="165" cy="80" rx="60" ry="33" fill="white"/><ellipse cx="215" cy="98" rx="55" ry="25" fill="white"/></g><g class="cloud slow"><ellipse cx="790" cy="110" rx="42" ry="22" fill="white"/><ellipse cx="830" cy="95" rx="55" ry="30" fill="white"/><ellipse cx="880" cy="112" rx="50" ry="22" fill="white"/></g>${extra}<path class="leaf" d="M70 410 C100 392 125 405 130 430 C100 443 78 430 70 410Z" fill="#e79655"/><path class="leaf" d="M1010 405 C1038 388 1065 402 1070 427 C1040 442 1017 430 1010 405Z" fill="#efa95e"/></svg>`;
}
function sceneMarkup(kind) {
 if(kind==='gate') return baseScene(torii(105,180,1.05)+kid(460,325,.86)+dad(340,305,.72)+deer(710,330,.78));
 if(kind==='deer_walk') return baseScene(deer(85,345,.62)+deer(340,355,.58)+deer(760,335,.72)+kid(615,315,.8)+dad(910,305,.65));
 if(kind==='calm') return baseScene(kid(470,320,.82)+dad(325,305,.7)+deer(690,340,.85)+`<circle class="sparkle" cx="810" cy="305" r="8" fill="#fff2a0"/><circle class="sparkle" cx="865" cy="320" r="6" fill="#fff2a0"/>`);
 if(kind==='crackers') return baseScene(kid(480,315,.82)+deer(690,335,.86)+`<rect x="545" y="390" width="96" height="48" rx="12" fill="#ffe28f" stroke="#9a6c31" stroke-width="4"/><text x="558" y="423" font-size="23" font-weight="800" fill="#674823">鹿仙贝</text><circle cx="572" cy="458" r="18" fill="#e0bd72" stroke="#9a6c31" stroke-width="3"/><circle cx="615" cy="458" r="18" fill="#e0bd72" stroke="#9a6c31" stroke-width="3"/>`);
 if(kind==='bow') return baseScene(kid(465,330,.86)+deer(690,325,.88,true)+`<polygon class="sparkle" points="640,285 650,307 672,315 650,323 640,345 630,323 608,315 630,307" fill="#ffdf6e"/><polygon class="sparkle" points="830,265 837,282 855,290 837,298 830,315 823,298 805,290 823,282" fill="#ffdf6e"/>`);
 if(kind==='temple') return baseScene(temple(80,210,1.05)+dad(560,350,.62)+kid(680,365,.72)+deer(820,365,.65));
 if(kind==='lanterns') return baseScene(lantern(120,265,1)+lantern(270,282,.9)+lantern(420,265,1)+lantern(570,282,.9)+torii(740,220,.75)+kid(805,360,.68)+deer(925,385,.56));
 if(kind==='pond') return baseScene(pagoda(110,175,.72)+`<ellipse class="water" cx="610" cy="455" rx="330" ry="80" fill="#8ed0df" stroke="#4f90a0" stroke-width="4"/><path class="water" d="M360 460 Q500 430 640 460 T890 460" fill="none" stroke="#e8fbff" stroke-width="5"/>`+kid(720,345,.65)+deer(850,382,.55));
 if(kind==='clean') return baseScene(kid(470,320,.82)+deer(680,340,.83)+`<rect x="300" y="405" width="90" height="70" rx="15" fill="#f5df9c" stroke="#95713b" stroke-width="4"/><path d="M325 405 Q345 365 365 405" fill="none" stroke="#95713b" stroke-width="5"/><rect x="220" y="370" width="85" height="60" rx="10" fill="white" stroke="#69a9c9" stroke-width="4"/>`);
 return baseScene(torii(80,245,.65)+pagoda(780,175,.48)+dad(380,330,.62)+kid(500,350,.72)+deer(650,360,.7)+`<rect x="825" y="365" width="190" height="120" rx="18" fill="#fff8e8" stroke="#b28255" stroke-width="4"/><text x="855" y="418" font-size="32" font-weight="800" fill="#76533e">Nara Park</text><text x="860" y="455" font-size="20" fill="#5d6d70">a gentle day</text>`);
}
function renderSlides() {
 const root = document.getElementById('slides');
 root.innerHTML = pages.map((p,i)=>`<section class="scene ${i===0?'active':''}" data-i="${i}">${sceneMarkup(p.scene)}<div class="textcard"><div class="en">${p.en}</div><div class="cn">${p.cn}</div><div class="q"><b>亲子提问：</b>${p.q}</div></div></section>`).join('');
}
function show(i) {
 const slides = [...document.querySelectorAll('.scene')];
 current = (i + pages.length) % pages.length;
 slides.forEach((s,idx)=>s.classList.toggle('active', idx===current));
 document.getElementById('pageNo').textContent = String(current+1).padStart(2,'0');
}
function next() { show(current+1); }
function prev() { show(current-1); }
function start() { clearInterval(timer); if(playing) timer = setInterval(next, 6500); }
renderSlides(); start();
document.getElementById('nextBtn').onclick = () => { next(); start(); };
document.getElementById('prevBtn').onclick = () => { prev(); start(); };
document.getElementById('playBtn').onclick = () => { playing = !playing; document.getElementById('playBtn').textContent = playing ? '暂停' : '自动播放'; start(); };
document.addEventListener('keydown', e => { if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); });
</script>
</body>
</html>
