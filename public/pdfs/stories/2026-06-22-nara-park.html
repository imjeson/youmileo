let index = 0;
let playing = true;
let timer = null;
const img = document.getElementById('sceneImg');
const enTitle = document.getElementById('enTitle');
const zhTitle = document.getElementById('zhTitle');
const zhText = document.getElementById('zhText');
const question = document.getElementById('question');
const pageNum = document.getElementById('pageNum');
const dots = document.getElementById('dots');
const playBtn = document.getElementById('playBtn');
const ribbon = document.getElementById('ribbon');
function pad(n) { return String(n).padStart(2,'0'); }
function makeSparkles() {
  document.querySelectorAll('.sparkle').forEach(e=>e.remove());
  const book = document.getElementById('book');
  for(let i=0;i<28;i++) {
    const s = document.createElement('div'); s.className='sparkle';
    s.style.left = (6 + Math.random()*88) + '%';
    s.style.top = (10 + Math.random()*70) + '%';
    s.style.animationDelay = (Math.random()*2.6) + 's';
    s.style.transform = `scale(${0.7+Math.random()*1.1})`;
    book.appendChild(s);
  }
}
function update() {
  const s = scenes[index];
  img.style.opacity = 0;
  setTimeout(()=>{ img.src = s.img; img.style.opacity = 1; }, 110);
  enTitle.textContent = s.en;
  zhTitle.textContent = '中文标题：' + s.en.replace('!', '') + ' / 奈良公园小旅行';
  zhText.textContent = s.zh;
  question.textContent = '亲子提问：' + s.q;
  pageNum.textContent = `${pad(index+1)} / ${pad(scenes.length)}`;
  ribbon.textContent = index === 0 ? '像爸爸讲故事：奈良公园' : '温柔旅行：和小鹿做朋友';
  dots.innerHTML = scenes.map((_,i)=>`<span class="dot ${i===index?'active':''}"></span>`).join('');
  makeSparkles();
}
function next() { index = (index + 1) % scenes.length; update(); }
function prev() { index = (index - 1 + scenes.length) % scenes.length; update(); }
function startTimer() { clearInterval(timer); if(playing) timer = setInterval(next, 5200); }
document.getElementById('nextBtn').addEventListener('click', ()=>{ next(); startTimer(); });
document.getElementById('prevBtn').addEventListener('click', ()=>{ prev(); startTimer(); });
playBtn.addEventListener('click', ()=>{ playing = !playing; playBtn.textContent = playing ? '暂停自动播放' : '开始自动播放'; startTimer(); });
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'){next();startTimer();} if(e.key==='ArrowLeft'){prev();startTimer();} });
update(); startTimer();
</script>
</body>
</html>
