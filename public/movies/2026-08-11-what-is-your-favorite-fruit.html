<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>What Is Your Favorite Fruit? | 优米Leo看世界</title>
<style>
:root{--accent:#ff6b6b;--bg1:#fff7e8;--bg2:#eefcf3;--ink:#2f2a26;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at top left,#fff7dd 0,#fffaf2 36%,#f4fff8 100%);color:var(--ink);overflow:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(1px);opacity:.22;pointer-events:none;animation:floatOrb 9s ease-in-out infinite alternate}
body:before{width:220px;height:220px;background:#ffd56a;top:-70px;right:-40px}
body:after{width:180px;height:180px;background:#b7efc5;bottom:-60px;left:-50px;animation-delay:-3s}
@keyframes floatOrb{to{transform:translate3d(24px,16px,0) scale(1.08)}}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1100px;margin:auto;padding:14px 14px 12px;gap:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(16px,2.4vw,24px)}
.logo{padding:7px 13px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--accent),#ffb347);box-shadow:0 6px 16px #0002}
.counter{font-size:14px;color:#725f50;background:#fff9;padding:7px 11px;border:1px solid #ffffffaa;border-radius:999px;backdrop-filter:blur(8px)}
.stage{position:relative;min-height:0;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 18px 50px #684b2f22;border:1px solid #ffffff;isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(24,19,14,.62) 100%);z-index:2;pointer-events:none}
.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);animation:kenburns 6.5s ease-in-out forwards}
@keyframes kenburns{0%{transform:scale(1.08) translate3d(-1%,0,0)}100%{transform:scale(1.02) translate3d(1%,0,0)}}
.sparkles{position:absolute;inset:0;z-index:3;pointer-events:none}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff7;box-shadow:0 0 18px #fff;animation:twinkle 2.2s ease-in-out infinite}
.spark:nth-child(1){left:9%;top:17%} .spark:nth-child(2){left:86%;top:20%;animation-delay:.6s} .spark:nth-child(3){left:76%;top:48%;animation-delay:1.2s} .spark:nth-child(4){left:18%;top:54%;animation-delay:1.7s}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.25}50%{transform:scale(1.7);opacity:1}}
.caption{position:absolute;left:clamp(16px,4vw,46px);right:clamp(16px,4vw,46px);bottom:clamp(18px,4vw,38px);z-index:4;color:white;text-shadow:0 3px 14px #0008}
.speaker{display:inline-flex;align-items:center;gap:8px;font-size:clamp(12px,1.7vw,16px);font-weight:800;background:color-mix(in srgb,var(--accent) 82%,transparent);padding:7px 12px;border-radius:999px;box-shadow:0 8px 18px #0003;margin-bottom:9px}
.en{font-size:clamp(25px,4.6vw,50px);line-height:1.08;font-weight:950;letter-spacing:-.02em;max-width:920px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.cn{font-size:clamp(17px,2.6vw,28px);line-height:1.35;margin-top:8px;font-weight:800;animation:rise .8s .12s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fruitFloat{position:absolute;z-index:3;font-size:clamp(34px,6vw,62px);filter:drop-shadow(0 8px 8px #0003);animation:bob 3s ease-in-out infinite}
.f1{right:5%;top:8%} .f2{left:4%;top:10%;animation-delay:-1.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;z-index:5}
button{appearance:none;border:0;border-radius:16px;padding:11px 14px;font-size:15px;font-weight:850;cursor:pointer;background:#fff;box-shadow:0 6px 16px #6a4a2d18;color:#45382e;transition:.2s transform,.2s box-shadow}
button:hover{transform:translateY(-2px);box-shadow:0 10px 22px #6a4a2d24}
button:active{transform:translateY(0)}
.prev{justify-self:start} .next{justify-self:end}
.play{background:linear-gradient(135deg,var(--accent),#ffb65c);color:white;min-width:132px}
.audio{position:absolute;z-index:5;right:16px;top:16px;background:#ffffffdd;padding:9px 12px;border-radius:999px;font-size:14px;box-shadow:0 8px 18px #0002}
.dots{display:flex;justify-content:center;gap:6px;position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:10px}
.dot{width:7px;height:7px;border-radius:50%;background:#ffffff66;transition:.25s} .dot.on{width:22px;border-radius:99px;background:white}
.hint{display:none}
@media (max-width:650px){
  .app{padding:8px 8px 10px;gap:7px}
  .stage{border-radius:21px}
  .caption{bottom:35px}
  .en{font-size:clamp(24px,8vw,38px)}
  .cn{font-size:clamp(16px,5vw,23px)}
  button{padding:10px 12px;font-size:13px;border-radius:14px}
  .play{min-width:108px}
  .audio{font-size:12px;top:10px;right:10px}
}
</style>
</head>

</div>

let i=0, timer=null, playing=false;
const $=id=>document.getElementById(id);
const hero=$('hero'), en=$('en'), cn=$('cn'), speaker=$('speaker'), counter=$('counter'), dots=$('dots'), play=$('play');
function renderDots(){dots.innerHTML=slides.map((_,n)=>`<span class="dot ${n===i?'on':''}"></span>`).join('')}
function render(){
 const s=slides[i]; document.documentElement.style.setProperty('--accent',s.accent);
 hero.style.animation='none'; void hero.offsetWidth; hero.style.animation='kenburns 6.5s ease-in-out forwards';
 hero.src=s.img; en.textContent=s.en; cn.textContent=s.cn; speaker.textContent=`${s.speaker} · ${s.speakerCn}`; counter.textContent=`${i+1} / ${slides.length}`;
 $('fruit1').textContent=i<3?'🍉':(i<6?'🍇':'🍉'); $('fruit2').textContent=i<3?'✨':(i<6?'✨':'🍇');
 renderDots();
}
function next(){i=(i+1)%slides.length;render(); if(playing) speak(false)}
function prev(){i=(i-1+slides.length)%slides.length;render()}
$('next').onclick=next; $('prev').onclick=prev;
function speak(userInitiated=true){
 if(!('speechSynthesis' in window)) return;
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(slides[i].en); u.lang='en-US'; u.rate=.82; u.pitch=1.05;
 const voices=speechSynthesis.getVoices(); const v=voices.find(v=>v.lang.startsWith('en') && /Samantha|Ava|Google US English|Daniel|Karen/i.test(v.name)) || voices.find(v=>v.lang.startsWith('en'));
 if(v)u.voice=v; speechSynthesis.speak(u);
}
$('speakBtn').onclick=()=>speak(true);
function setPlaying(on){
 playing=on; clearInterval(timer); play.textContent=on?'⏸ 暂停':'▶ 自动播放';
 if(on){speak(true); timer=setInterval(next,6500)}
}
play.onclick=()=>setPlaying(!playing);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();setPlaying(!playing)}});
let startX=null; $('stage').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true}); $('stage').addEventListener('touchend',e=>{if(startX==null)return;let dx=e.changedTouches[0].clientX-startX;if(dx<-45)next();if(dx>45)prev();startX=null},{passive:true});
render();
</script>
