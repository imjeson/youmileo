<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>优米Leo看世界 - 水果蓝莓特别之处？</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif;background:linear-gradient(135deg,#fff7e8,#eef2ff);color:#25264a;overflow:hidden}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{position:relative;width:min(1180px,96vw);height:min(680px,92vh);border-radius:34px;background:#fff;box-shadow:0 18px 45px rgba(52,61,145,.18);overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,#f8fbff 0 24%,transparent 25%),linear-gradient(135deg,var(--bg),#ffffff)}
.blob{position:absolute;border-radius:50%;filter:blur(.2px);opacity:.65;animation:float 4s ease-in-out infinite}
.blob.one{width:180px;height:180px;background:#dfe8ff;left:60px;top:50px} .blob.two{width:120px;height:120px;background:#fff0bd;right:90px;bottom:90px;animation-delay:1s}
.illustration{position:absolute;left:6%;top:13%;width:50%;height:72%;display:flex;align-items:center;justify-content:center}
.text{position:absolute;right:5%;top:13%;width:36%;height:72%;padding:34px;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:inset 0 0 0 2px rgba(91,99,190,.12)}
h1{font-size:42px;line-height:1.12;margin:22px 0;color:#293174} .zh{font-size:23px;line-height:1.55;color:#333} .question{position:absolute;left:34px;right:34px;bottom:30px;background:#fff1bd;padding:18px 20px;border-radius:18px;font-size:20px;color:#714300} .label{font-weight:700;color:#3b48a5}
.pageNo{font-weight:800;color:#5864bc;font-size:20px} .title{position:absolute;left:0;right:0;bottom:17px;text-align:center;color:#71718a;font-weight:700}
.controls{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:12px;z-index:5} button{border:0;border-radius:999px;padding:12px 20px;background:#4455bc;color:#fff;font-size:16px;cursor:pointer;box-shadow:0 6px 14px rgba(68,85,188,.25)} button.secondary{background:#fff;color:#4455bc}
.blueberry{position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#7d8dea 0 16%,#465ac8 17% 65%,#2f3a95 66%);box-shadow:inset -8px -12px 0 rgba(25,33,105,.18);animation:bob 2.8s ease-in-out infinite} .blueberry::before{content:'✦';position:absolute;left:34px;top:18px;color:#202767;font-size:24px} .blueberry::after{content:'';position:absolute;left:24px;top:44px;width:42px;height:20px;border-bottom:5px solid #202767;border-radius:50%}
.eye{position:absolute;top:35px;width:10px;height:10px;background:#fff;border-radius:50%} .eye.l{left:27px} .eye.r{right:27px}
.leaf{position:absolute;width:90px;height:38px;border-radius:80% 0 80% 0;background:#70bd6d;transform:rotate(-20deg);animation:sway 3s ease-in-out infinite}
.rainbow{position:absolute;width:420px;height:220px;border-radius:420px 420px 0 0;border:24px solid transparent;border-top-color:#e95b5b;box-shadow:0 -25px 0 -4px #f6a043,0 -50px 0 -4px #f7d85b,0 -75px 0 -4px #6ab86b,0 -100px 0 -4px #6aa8e9,0 -125px 0 -4px #7864c7;animation:rise 1.2s ease-out}
.snow{position:absolute;color:#86d7ff;font-size:36px;animation:spin 4s linear infinite} .food{position:absolute;width:360px;height:170px;border-radius:50%;background:#f1c48b;display:flex;align-items:center;justify-content:center;animation:bob 3s infinite} .food::before{content:'';width:310px;height:110px;border-radius:50%;background:#fff;position:absolute}
.seed{position:absolute;width:8px;height:14px;border-radius:50%;background:#f5d16f;animation:twinkle 1.8s infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}} @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(18px) scale(1.04)}} @keyframes sway{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-5deg)}} @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}} @keyframes spin{to{transform:rotate(360deg)}} @keyframes twinkle{from{opacity:.4;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}
</style></head><body><div class="stage"><div class="card" id="card"><div class="bg"></div><div class="blob one"></div><div class="blob two"></div><div class="illustration" id="art"></div><div class="text"><div class="pageNo" id="no"></div><h1 id="en"></h1><div class="zh" id="zh"></div><div class="question"><span class="label">亲子提问：</span><span id="q"></span></div></div><div class="title">优米Leo看世界 · 水果蓝莓特别之处？</div></div></div><div class="controls"><button class="secondary" onclick="prev()">上一页</button><button onclick="togglePlay()" id="play">暂停</button><button class="secondary" onclick="next()">下一页</button></div>
<script>
const slides=[{"en": "Blueberries are tiny blue treasures.", "zh": "蓝莓小小的，像藏在树丛里的蓝色小宝石。它们不需要很大，也能让人一眼就发现。", "q": "你觉得蓝莓更像小珠子，还是小星球？", "scene": "treasure"}, {"en": "Their blue color comes from plant magic.", "zh": "蓝莓的蓝紫色来自植物里的天然颜色小帮手，叫花青素。它让蓝莓看起来特别神秘。", "q": "你还见过哪些蓝紫色的水果或食物？", "scene": "pigment"}, {"en": "A soft white coat protects them.", "zh": "新鲜蓝莓表面常有一层淡淡的白霜，像穿了一件轻轻的保护外套，帮助果皮保持舒服。", "q": "你摸过带白霜的蓝莓吗？感觉像什么？", "scene": "bloom"}, {"en": "Blueberries grow together in little groups.", "zh": "蓝莓不是一个人长大的，它们常常一颗挨着一颗，像小朋友排队一样挂在枝头。", "q": "如果蓝莓会聊天，它们排队时会说什么？", "scene": "bunch"}, {"en": "Inside, they hide many tiny seeds.", "zh": "咬开蓝莓，里面很软，还有一些小小的种子。种子很轻很细，像果肉里的小秘密。", "q": "你吃蓝莓时能感觉到小种子吗？", "scene": "seeds"}, {"en": "They can be sweet, sour, and juicy.", "zh": "有的蓝莓甜甜的，有的蓝莓酸酸的，还有的轻轻一咬就爆出果汁。每一颗都像小惊喜。", "q": "你喜欢甜一点的蓝莓，还是酸一点的蓝莓？", "scene": "taste"}, {"en": "Blueberries are fun in many foods.", "zh": "蓝莓可以放进酸奶、燕麦、松饼，也可以做成果酱。它会把普通食物变得更漂亮。", "q": "你最想把蓝莓放进哪一种食物里？", "scene": "food"}, {"en": "Cold blueberries are like fruit ice dots.", "zh": "把蓝莓冷冻起来，它们会变成凉凉的小果粒，夏天吃起来像会融化的水果小冰球。", "q": "你想试试冷冻蓝莓吗？为什么？", "scene": "frozen"}, {"en": "Blueberries help us eat more colors.", "zh": "吃水果时，颜色越丰富，餐盘就越像彩虹。蓝莓把蓝色和紫色带到了我们的餐桌上。", "q": "今天你的水果彩虹里已经有哪些颜色？", "scene": "rainbow"}, {"en": "A little berry can make a big smile.", "zh": "蓝莓最特别的地方，是它小小一颗，却能带来颜色、味道、好奇心和快乐。", "q": "你会把第一颗蓝莓分享给谁？", "scene": "smile"}]; let idx=0; let playing=true; let timer=null; const bgs=["#FFF7E8", "#F2F0FF", "#F0FAFF", "#F7FFE8", "#FFF4F4", "#FFFBEA", "#F4F8FF", "#EEF9FF", "#FFF4FA", "#F3FFF7"];
function berry(x,y,s=1,delay=0){return `<div class="blueberry" style="left:${x}px;top:${y}px;transform:scale(${s});animation-delay:${delay}s"><i class="eye l"></i><i class="eye r"></i></div>`}
function art(scene){
 if(scene==='treasure')return berry(110,120,1.3)+berry(230,90,1)+berry(330,170,1.15)+`<div class="leaf" style="left:330px;top:85px"></div>`;
 if(scene==='pigment')return berry(170,130,1.7)+`<div class="blob" style="left:390px;top:110px;width:80px;height:80px;background:#8353dd"></div><div class="blob" style="left:430px;top:250px;width:55px;height:55px;background:#324bc0"></div><div style="position:absolute;left:360px;top:60px;font-size:28px;color:#5d3eb8;font-weight:800">anthocyanin</div>`;
 if(scene==='bloom')return berry(185,120,1.8)+`<div style="position:absolute;left:145px;top:80px;width:210px;height:210px;border:10px solid #fff;border-radius:50%;animation:float 3s infinite"></div>`;
 if(scene==='bunch')return `<div class="leaf" style="left:80px;top:70px"></div><div style="position:absolute;left:95px;top:130px;width:390px;height:10px;background:#789b40;transform:rotate(-28deg);border-radius:10px"></div>`+berry(165,155,1)+berry(245,120,1.05)+berry(310,175,.95)+berry(230,235,1);
 if(scene==='seeds')return `<div class="blueberry" style="left:145px;top:105px;width:260px;height:180px;border-radius:50%;animation:bob 3s infinite"></div>`+Array.from({length:18},(_,i)=>`<span class="seed" style="left:${190+(i*37)%170}px;top:${145+(i*29)%90}px"></span>`).join('');
 if(scene==='taste')return berry(95,150,1.1)+berry(235,130,1.2)+berry(380,160,1.05)+`<div style="position:absolute;left:100px;top:300px;font-size:30px;font-weight:800;color:#d25484">sweet</div><div style="position:absolute;left:250px;top:300px;font-size:30px;font-weight:800;color:#6482ce">juicy</div><div style="position:absolute;left:395px;top:300px;font-size:30px;font-weight:800;color:#e4a23b">sour</div>`;
 if(scene==='food')return `<div class="food" style="left:100px;top:155px"></div>`+berry(170,185,.5)+berry(245,210,.45)+berry(310,175,.5)+berry(370,220,.42);
 if(scene==='frozen')return berry(120,150,1)+berry(245,120,1.2)+berry(365,165,1)+`<div class="snow" style="left:95px;top:70px">✳</div><div class="snow" style="left:400px;top:80px;animation-delay:1s">✳</div><div class="snow" style="left:300px;top:290px;animation-delay:2s">✳</div>`;
 if(scene==='rainbow')return `<div class="rainbow" style="left:75px;top:145px"></div>`+berry(250,265,1.1)+`<div style="position:absolute;left:120px;top:310px;width:50px;height:50px;border-radius:50%;background:#e95b5b"></div><div style="position:absolute;left:410px;top:310px;width:50px;height:50px;border-radius:50%;background:#f7d85b"></div>`;
 return berry(190,125,1.9)+`<div class="leaf" style="left:340px;top:105px"></div><div style="position:absolute;left:110px;top:290px;width:360px;height:120px;border-bottom:18px solid #f0b8cf;border-radius:50%;animation:rise 1s"></div>`;
}
function render(){const s=slides[idx];document.documentElement.style.setProperty('--bg',bgs[idx]);document.getElementById('no').textContent='Page '+(idx+1);document.getElementById('en').textContent=s.en;document.getElementById('zh').textContent=s.zh;document.getElementById('q').textContent=s.q;document.getElementById('art').innerHTML=art(s.scene)}
function next(){idx=(idx+1)%slides.length;render()} function prev(){idx=(idx-1+slides.length)%slides.length;render()}
function togglePlay(){playing=!playing;document.getElementById('play').textContent=playing?'暂停':'播放';if(playing)start();else clearInterval(timer)} function start(){clearInterval(timer);timer=setInterval(next,5200)}
render();start();
</script></body></html>
