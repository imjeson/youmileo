<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>优米Leo看世界 - 人为什么要帮助别人？</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eaf8ff;color:#24324a}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.player{width:min(1180px,96vw);aspect-ratio:16/9;background:linear-gradient(#EAF8FF 0 48%,#FFF8E7 48% 100%);border:8px solid #bfe7ff;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.14);position:relative;overflow:hidden}.sun{position:absolute;right:7%;top:7%;width:86px;height:86px;background:#FFE58A;border-radius:50%;box-shadow:0 0 30px #ffd166;animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}.cloud{position:absolute;width:90px;height:36px;background:white;border-radius:40px;opacity:.95;animation:drift 18s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}.cloud:before{width:42px;height:42px;left:18px;top:-18px}.cloud:after{width:34px;height:34px;left:52px;top:-10px}.c1{left:8%;top:10%}.c2{left:58%;top:14%;animation-duration:22s}.c3{left:35%;top:22%;animation-duration:26s}@keyframes drift{0%,100%{transform:translateX(-30px)}50%{transform:translateX(35px)}}.hill{position:absolute;bottom:-24%;width:55%;height:45%;background:#BEE7A5;border-radius:50% 50% 0 0}.h1{left:-10%}.h2{right:-12%;background:#A8D98B}.content{position:absolute;inset:0;display:grid;grid-template-columns:42% 58%;padding:48px 64px 88px;gap:20px;z-index:2}.left{display:flex;flex-direction:column;justify-content:center}.badge{width:64px;height:64px;background:#6BA84F;color:white;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin-bottom:24px}h1{font-size:clamp(30px,4.1vw,56px);line-height:1.12;margin:0 0 24px;color:#1D3557}.cn{font-size:clamp(20px,2.4vw,32px);line-height:1.35;margin-bottom:28px}.question{background:rgba(255,243,176,.9);border-radius:22px;padding:20px 24px;font-size:clamp(16px,1.7vw,24px);line-height:1.42;box-shadow:0 8px 20px rgba(122,92,0,.12)}.question b{color:#7A5C00}.scene{position:relative;display:flex;align-items:center;justify-content:center}.leo{position:absolute;width:170px;height:260px;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}.head{position:absolute;left:45px;top:20px;width:86px;height:86px;background:#FFD2A6;border-radius:50%}.hair span{position:absolute;background:#7A431D;border-radius:50%}.hair span:nth-child(1){left:32px;top:10px;width:36px;height:34px}.hair span:nth-child(2){left:56px;top:5px;width:40px;height:38px}.hair span:nth-child(3){left:84px;top:14px;width:34px;height:34px}.eye{position:absolute;top:53px;width:8px;height:8px;background:#3A2415;border-radius:50%}.e1{left:68px}.e2{left:100px}.smile{position:absolute;left:76px;top:74px;width:28px;height:12px;border-bottom:3px solid #7A431D;border-radius:0 0 20px 20px}.body{position:absolute;left:40px;top:106px;width:98px;height:125px;background:#2E8BC0;border-radius:22px}.body:before{content:"Leo";position:absolute;color:#FFD166;font-weight:800;left:30px;top:34px}.arm{position:absolute;width:74px;height:12px;background:#FFD2A6;border-radius:10px;top:142px}.a1{left:-6px;transform:rotate(30deg)}.a2{right:-8px;transform:rotate(-30deg)}.leg{position:absolute;width:14px;height:58px;background:#495057;top:218px;border-radius:12px}.l1{left:62px;transform:rotate(14deg)}.l2{left:102px;transform:rotate(-14deg)}.prop{position:absolute;font-size:88px;animation:float 1.8s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15))}@keyframes float{50%{transform:translateY(-14px) scale(1.05)}}.friend{position:absolute;width:120px;height:180px;transform:translate(150px,35px) scale(.82);opacity:.95}.friend .head{left:30px;top:18px}.friend .body{left:25px;top:102px;background:#F77F00}.friend .eye.e1{left:55px}.friend .eye.e2{left:82px}.friend .smile{left:63px}.team-icon{position:absolute;font-size:56px;animation:pop 1.2s ease-in-out infinite alternate}@keyframes pop{from{transform:scale(.9)}to{transform:scale(1.08)}}.controls{position:absolute;z-index:5;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center}button{border:0;padding:13px 28px;border-radius:999px;background:white;box-shadow:0 6px 20px rgba(0,0,0,.12);cursor:pointer;font-size:18px;font-weight:700;color:#466}.counter{background:white;padding:13px 34px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.12);font-weight:800}.topbar{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.brand,.auto{background:rgba(255,255,255,.85);border-radius:20px;padding:10px 18px;font-weight:900;color:#2E8BC0}.auto{pointer-events:auto;cursor:pointer;color:#466}.fade{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.content{grid-template-columns:1fr;padding:38px 28px 90px}.scene{display:none}.player{aspect-ratio:9/14}}
</style></head><body><div class="app"><main class="player"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="hill h1"></div><div class="hill h2"></div><div class="topbar"><div class="brand">优米Leo看世界</div><div class="auto" id="autoBtn">自动播放：开</div></div><section class="content fade" id="page"></section><div class="controls"><button id="prev">◀ 上一页</button><div class="counter" id="counter">1 / 10</div><button id="next">下一页 ▶</button></div></main></div>
<script>
const pages=[{"title": "Helping makes the world warmer.", "cn": "帮助别人，就像给世界加了一点温暖。", "q": "你有没有感受过别人的帮助？当时是什么感觉？", "theme": "heart"}, {"title": "We help because we care.", "cn": "我们帮助别人，是因为我们在乎他们。", "q": "你会怎么帮助一个摔倒的小朋友？", "theme": "friend"}, {"title": "Helping others can make them feel happy.", "cn": "我们的帮助，会让别人的心里变得开心。", "q": "看到别人因为你的帮助笑了，你会有什么感觉？", "theme": "umbrella"}, {"title": "It also makes us feel good.", "cn": "帮助别人，也会让我们自己感觉很好。", "q": "你帮助别人之后，心里是什么感觉？", "theme": "glow"}, {"title": "Small help can make a big difference.", "cn": "小小的帮助，也能带来大大的改变。", "q": "你做过哪件小事，却帮到了别人？", "theme": "puppy"}, {"title": "We can help in many ways.", "cn": "我们可以用很多方法去帮助别人。", "q": "除了物品帮助，你还能用什么方式帮助别人？", "theme": "icons"}, {"title": "Helping builds kind hearts.", "cn": "帮助别人，会让我们的心变得更善良。", "q": "你觉得一个善良的人会做些什么？", "theme": "kind"}, {"title": "We all need help sometimes.", "cn": "有时候，我们自己也需要别人的帮助。", "q": "当你需要帮助时，你会怎么说？", "theme": "sign"}, {"title": "When we help each other, we are a team.", "cn": "当我们互相帮助，我们就是一个团队。", "q": "你和谁一起合作完成过一件事？", "theme": "team"}, {"title": "Let’s help today and every day!", "cn": "从今天开始，每一天，我们都可以成为小小的帮助者！", "q": "今天你想为谁做一件小小的好事呢？", "theme": "banner"}];let idx=0,auto=true,timer=null;const pageEl=document.getElementById('page'),counterEl=document.getElementById('counter'),autoBtn=document.getElementById('autoBtn');const props={heart:'💛',friend:'🤝',umbrella:'☂️',glow:'✨',puppy:'🐶',icons:'🎧 📖 🤝 😊',kind:'💗',sign:'❓',team:'🧱',banner:'🌈'};function render(){const p=pages[idx],prop=props[p.theme]||'💛';pageEl.classList.remove('fade');void pageEl.offsetWidth;pageEl.classList.add('fade');pageEl.innerHTML=`<div class="left"><div class="badge">${idx+1}</div><h1>${p.title}</h1><div class="cn">${p.cn}</div><div class="question"><b>亲子提问：</b><br>${p.q}</div></div><div class="scene"><div class="leo"><div class="hair"><span></span><span></span><span></span></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="smile"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="friend"><div class="hair"><span></span><span></span><span></span></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="smile"></div><div class="body"></div></div><div class="prop">${prop}</div><div class="team-icon" style="left:8%;top:18%">💛</div><div class="team-icon" style="right:10%;top:24%;animation-delay:.4s">⭐</div><div class="team-icon" style="left:18%;bottom:18%;animation-delay:.8s">🌸</div></div>`;counterEl.textContent=`${idx+1} / ${pages.length}`}function next(){idx=(idx+1)%pages.length;render()}function prev(){idx=(idx-1+pages.length)%pages.length;render()}function start(){clearInterval(timer);if(auto)timer=setInterval(next,5200)}document.getElementById('next').onclick=()=>{next();start()};document.getElementById('prev').onclick=()=>{prev();start()};autoBtn.onclick=()=>{auto=!auto;autoBtn.textContent='自动播放：'+(auto?'开':'关');start()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();start();
</script></body></html>
