<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>2026-06-16-why-do-we-drink-water</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(circle at top, #f5fcff 0%, #dff4ff 54%, #bfe8ff 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.bubble {
  position:absolute; border-radius:50%; background:rgba(255,255,255,.28); filter:blur(1px);
  animation: float 8s ease-in-out infinite;
}
.b1 { width:110px;height:110px;left:6%;top:10%; }
.b2 { width:160px;height:160px;right:8%;top:12%;animation-delay:1.2s; }
.b3 { width:90px;height:90px;left:12%;bottom:16%;animation-delay:2.1s; }
.b4 { width:130px;height:130px;right:14%;bottom:15%;animation-delay:3s; }
.scene {
  position:absolute; inset:3.5vh 4vw 11vh; border-radius:32px; overflow:hidden;
  background:rgba(255,255,255,.42); box-shadow:0 20px 54px rgba(50,90,120,.18);
  display:flex; align-items:center; justify-content:center;
}
svg { width:100%; height:100%; }
#enLine, #zhLine { margin:0; }
.subtitle {
  position:absolute; left:50%; bottom:82px; transform:translateX(-50%);
  width:min(950px,90vw); padding:14px 18px; border-radius:22px;
  background:rgba(255,255,255,.78); backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.10); text-align:center;
}
.en { font-size:clamp(19px,2vw,28px); font-weight:800; color:#205D7A; margin-bottom:6px; }
.zh { font-size:clamp(14px,1.35vw,18px); color:#4F6A75; line-height:1.5; }
.controls {
  position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:999px;
  background:rgba(255,255,255,.60); backdrop-filter:blur(12px);
  box-shadow:0 10px 24px rgba(0,0,0,.10);
}
button {
  border:none; border-radius:999px; padding:10px 16px; font-size:14px; font-weight:700;
  cursor:pointer; color:#255D73; background:#fff; box-shadow:0 5px 12px rgba(0,0,0,.08);
}
.counter {
  min-width:62px; text-align:center; padding:10px 12px; font-size:14px; font-weight:800;
  color:#255D73; background:#BFEFFF; border-radius:999px;
}
.drop { animation: bob 3.5s ease-in-out infinite; transform-origin:center; }
.child { animation: breathe 4s ease-in-out infinite; transform-origin:center; }
.spark { animation: sparkle 2.8s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-22px) translateX(10px)} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
@keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }
@keyframes sparkle { 0%,100%{opacity:.35; transform:scale(.85)} 50%{opacity:1; transform:scale(1.15)} }
@media (max-width:768px) {
  .scene { inset:2vh 2.5vw 14.5vh; border-radius:20px; }
  .subtitle { bottom:78px; width:92vw; padding:12px 14px; }
  .controls { bottom:10px; gap:6px; padding:8px; }
  button { padding:9px 12px; font-size:13px; }
  .counter { min-width:54px; padding:9px 10px; font-size:13px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div>
  <div class="scene" id="scene"></div>
  <div class="subtitle"><div class="en" id="enLine"></div><div class="zh" id="zhLine"></div></div>
  <div class="controls">
    <button id="prevBtn">上一页</button>
    <div class="counter" id="counter">1/8</div>
    <button id="playBtn">暂停</button>
    <button id="nextBtn">下一页</button>
  </div>
</div>
<script>
const slides = [{"en": "Water is our body's good friend.", "zh": "水就像身体里的好朋友。我们每天玩耍、学习、说话、跑跳，身体都需要水来帮忙。", "q": "你今天喝过几次水了？", "scene": "friend"}, {"en": "Our body uses water every day.", "zh": "身体里的很多地方都需要水。血液、嘴巴、肚子、皮肤，都喜欢有足够的水分。", "q": "你觉得身体里哪里最需要水呢？", "scene": "body"}, {"en": "Water helps us stay cool.", "zh": "天气热、运动后，身体会出汗。喝水可以帮身体补回水分，让我们舒服一点。", "q": "你运动后会不会觉得很想喝水？", "scene": "cool"}, {"en": "Water helps our tummy work.", "zh": "喝水能帮助肚子更好地工作。吃进去的食物，也需要水一起帮忙。", "q": "吃饭的时候，你会不会想喝一点水？", "scene": "tummy"}, {"en": "Water helps us think and learn.", "zh": "如果很久不喝水，人可能会觉得累、头有点昏。喝点水，学习和玩耍会更有精神。", "q": "学习前，你愿意先喝一小口水吗？", "scene": "learn"}, {"en": "Water keeps our mouth happy.", "zh": "喝水可以让嘴巴不那么干，也能帮助我们说话、唱歌、讲故事的时候更舒服。", "q": "嘴巴干干的时候，你会想到喝水吗？", "scene": "mouth"}, {"en": "We can choose water often.", "zh": "甜甜的饮料可以偶尔喝，但白开水是每天都适合的好选择。它简单、干净，也很重要。", "q": "你更喜欢用什么杯子喝白开水？", "scene": "choice"}, {"en": "A small sip can be a healthy habit.", "zh": "不用一下子喝很多。早上、玩后、吃饭时、睡前少量喝一点，慢慢就会变成好习惯。", "q": "你想什么时候提醒自己喝一口水？", "scene": "habit"}];
let current = 0, playing = true, timer = null;
const scene = document.getElementById("scene");
const enLine = document.getElementById("enLine");
const zhLine = document.getElementById("zhLine");
const counter = document.getElementById("counter");
const playBtn = document.getElementById("playBtn");

function svgScene(label) {
  return `
  <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#E9FAFF"/><stop offset="100%" stop-color="#BFEFFF"/>
      </linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter>
    </defs>
    <rect width="1000" height="620" fill="url(#sky)"/>
    <circle cx="835" cy="105" r="54" fill="#FFE680"/>
    <circle class="spark" cx="160" cy="95" r="16" fill="#fff"/>
    <circle class="spark" cx="220" cy="130" r="10" fill="#fff"/>
    <rect x="110" y="455" width="780" height="68" rx="24" fill="#F7D7A8"/>
    <g class="child" filter="url(#shadow)">
      <circle cx="395" cy="280" r="64" fill="#FFD5B0"/>
      <path d="M330 270 Q390 180 460 265 Q430 218 360 215 Q330 232 330 270Z" fill="#5B3A29"/>
      <circle cx="373" cy="282" r="7" fill="#3D2A22"/>
      <circle cx="420" cy="282" r="7" fill="#3D2A22"/>
      <circle cx="356" cy="305" r="10" fill="#F08A82"/>
      <circle cx="438" cy="305" r="10" fill="#F08A82"/>
      <path d="M378 315 Q398 330 420 315" stroke="#7A493B" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="340" y="345" width="120" height="130" rx="30" fill="#69A8EA"/>
      <rect x="366" y="344" width="68" height="120" rx="18" fill="#FFD45A"/>
      <path d="M340 385 Q275 410 250 455" stroke="#FFD5B0" stroke-width="24" fill="none" stroke-linecap="round"/>
      <path d="M460 385 Q540 390 585 415" stroke="#FFD5B0" stroke-width="24" fill="none" stroke-linecap="round"/>
    </g>
    <g class="drop" filter="url(#shadow)">
      <path d="M680 170 C610 260 635 350 705 350 C775 350 800 260 730 170 C715 150 695 150 680 170Z" fill="#50BDF2"/>
      <circle cx="685" cy="270" r="7" fill="#135E80"/>
      <circle cx="725" cy="270" r="7" fill="#135E80"/>
      <path d="M685 295 Q705 312 728 295" stroke="#135E80" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="570" y="338" width="110" height="145" rx="18" fill="#fff" stroke="#6EC6F2" stroke-width="6"/>
      <rect x="590" y="392" width="70" height="66" rx="8" fill="#7FD5FF"/>
      <ellipse cx="625" cy="392" rx="35" ry="9" fill="#BEEFFF"/>
    </g>
    <text x="500" y="560" text-anchor="middle" font-family="Arial" font-weight="800" font-size="38" fill="#216A8A">${label}</text>
  </svg>`;
}

function render() {
  const s = slides[current];
  scene.innerHTML = svgScene(s.en);
  enLine.textContent = s.en;
  zhLine.textContent = s.zh;
  counter.textContent = `${current+1}/${slides.length}`;
}
function nextPage() { current = (current + 1) % slides.length; render(); }
function prevPage() { current = (current - 1 + slides.length) % slides.length; render(); }
function startAuto() {
  clearInterval(timer);
  timer = setInterval(() => { if (playing) nextPage(); }, 5200);
}
document.getElementById("nextBtn").onclick = nextPage;
document.getElementById("prevBtn").onclick = prevPage;
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "暂停" : "播放"; };
render(); startAuto();
</script>
</body>
</html>
