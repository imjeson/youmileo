<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>优米Leo看世界 - 彩虹是怎么形成的？</title>
<style>
:root{--ink:#17384c;--soft:#fffdf7;--blue:#2f80ed;--card:rgba(255,255,255,.92)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102c3b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#16394e,#0a2230);display:grid;place-items:center}
.stage{position:relative;width:min(94vw,1180px);aspect-ratio:1.414/1;background:var(--soft);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.42)}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.025);transition:opacity .75s ease,transform 1s ease}
.scene.active{opacity:1;pointer-events:auto;transform:scale(1)}
.sky{position:absolute;left:2.5%;right:2.5%;top:4.5%;height:61%;border-radius:26px;overflow:hidden}
.bg0{background:linear-gradient(#cfeeff,#eaf8ff 63%,#aee09d 64%)}.bg1{background:linear-gradient(160deg,#fff1c6,#ddf4ff)}.bg2{background:linear-gradient(#dff5ff,#f7fdff)}.bg3{background:linear-gradient(#e5f7ff,#cfeeff)}.bg4{background:linear-gradient(#fff0d6,#e7f8ff)}.bg5{background:linear-gradient(#eaf1ff,#dceaff)}.bg6{background:linear-gradient(#e5faff,#d4f0ff)}.bg7{background:linear-gradient(#fff0da,#d9efff 72%,#97d384 73%)}.bg8{background:linear-gradient(#dcecff,#edf8ff)}
.brand{position:absolute;left:3.2%;top:1.4%;font-weight:800;font-size:clamp(12px,1.15vw,18px);letter-spacing:.04em}.count{position:absolute;right:3.2%;top:1.6%;font-size:clamp(11px,1vw,15px);opacity:.55}
.textcard{position:absolute;left:3%;right:3%;bottom:2.5%;height:30%;background:var(--card);border:1px solid #dbe8ef;border-radius:22px;padding:1.6% 2.2%;box-shadow:0 12px 28px rgba(43,79,99,.12)}
.en{font-size:clamp(18px,2.15vw,32px);font-weight:850;line-height:1.16;margin-bottom:.7%}.zh{font-size:clamp(13px,1.28vw,20px);line-height:1.55;color:#3c5260;max-width:96%}.q{position:absolute;left:2.2%;right:2.2%;bottom:7%;border-radius:999px;padding:.7% 1.5%;background:#fff2d8;color:#93540e;font-size:clamp(12px,1.15vw,18px)}
.sun{position:absolute;width:11%;aspect-ratio:1;border-radius:50%;background:#ffd166;box-shadow:0 0 45px #ffe7a3;animation:sunPulse 3.2s ease-in-out infinite}.sun:before{content:"";position:absolute;inset:-35%;background:repeating-conic-gradient(#ffd166 0 4deg,transparent 4deg 27deg);clip-path:circle(48%);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sunPulse{50%{transform:scale(1.06);box-shadow:0 0 70px #ffe7a3}}
.cloud{position:absolute;width:17%;height:8%;background:white;border-radius:999px;filter:drop-shadow(0 8px 9px rgba(72,109,130,.14));animation:drift 8s ease-in-out infinite alternate}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}.cloud:before{width:42%;aspect-ratio:1;left:15%;top:-48%}.cloud:after{width:50%;aspect-ratio:1;right:12%;top:-63%}@keyframes drift{to{transform:translateX(28px)}}
.drop{position:absolute;width:16px;height:22px;background:#67b8ef;border-radius:60% 40% 65% 35%/70% 40% 60% 30%;transform:rotate(45deg);opacity:.78;animation:rain 1.55s linear infinite}@keyframes rain{from{translate:0 -55px;opacity:0}20%{opacity:.8}to{translate:-12px 175px;opacity:0}}
.rainbow{position:absolute;width:48%;aspect-ratio:2/1;border-radius:50% 50% 0 0/100% 100% 0 0;background:radial-gradient(ellipse at 50% 100%,transparent 0 43%,#9a63c7 43.5% 47%,#6e72d9 47.5% 51%,#52a7e8 51.5% 55%,#59b66f 55.5% 59%,#f4d35e 59.5% 63%,#f49a3c 63.5% 67%,#f05a59 67.5% 71%,transparent 71.5%);filter:drop-shadow(0 8px 16px rgba(84,105,170,.16));animation:rainbowGlow 3s ease-in-out infinite alternate}@keyframes rainbowGlow{to{filter:drop-shadow(0 8px 23px rgba(118,100,220,.35));transform:translateY(-5px)}}
.leo,.dad{position:absolute;transform-origin:50% 100%;animation:bob 2.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}.leo svg,.dad svg{width:100%;height:100%;overflow:visible}
.ray{position:absolute;height:8px;border-radius:999px;transform-origin:left center;animation:rayPulse 2.4s ease-in-out infinite alternate}@keyframes rayPulse{to{filter:brightness(1.18);opacity:.65}}
.prism{position:absolute;width:14%;aspect-ratio:1.1;clip-path:polygon(50% 0,0 100%,100% 100%);background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(130,210,255,.18));border:2px solid rgba(255,255,255,.9);filter:drop-shadow(0 8px 12px rgba(62,128,170,.2));animation:float 3s ease-in-out infinite}@keyframes float{50%{translate:0 -10px}}
.bigdrop{position:absolute;width:22%;aspect-ratio:1;border-radius:65% 35% 65% 35%/70% 40% 60% 30%;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(70,170,235,.15));border:2px solid rgba(255,255,255,.75);transform:rotate(45deg);box-shadow:inset 0 0 22px rgba(255,255,255,.55);animation:dropFloat 3s ease-in-out infinite}@keyframes dropFloat{50%{translate:0 -12px;rotate:3deg}}
.circleRainbow{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,transparent 0 43%,#9a63c7 44% 47%,#6e72d9 48% 51%,#52a7e8 52% 55%,#59b66f 56% 59%,#f4d35e 60% 63%,#f49a3c 64% 67%,#f05a59 68% 71%,transparent 72%);animation:circleSpin 10s linear infinite}@keyframes circleSpin{to{transform:rotate(360deg)}}
.spark{position:absolute;width:8px;aspect-ratio:1;background:white;border-radius:50%;box-shadow:0 0 15px white;animation:twinkle 1.6s ease-in-out infinite alternate}@keyframes twinkle{to{transform:scale(2);opacity:.35}}
.controls{position:absolute;left:50%;bottom:1.1%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:50;background:rgba(10,34,48,.76);padding:8px 12px;border-radius:999px;backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
button{border:0;border-radius:999px;background:white;color:#17384c;padding:8px 13px;font-weight:800;cursor:pointer}button:hover{transform:translateY(-1px)}#progress{width:150px;height:6px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#f05a59,#f4d35e,#59b66f,#52a7e8,#9a63c7);transition:width .3s}
.hint{position:absolute;right:3%;bottom:3%;z-index:40;font-size:12px;color:#fff;opacity:.7}
@media(max-width:700px){.stage{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}.sky{height:58%}.textcard{height:34%}.controls{bottom:1.2%}#progress{width:90px}}
</style>
</head><body><div id="app"><div class="stage" id="stage"></div><div class="controls"><button id="prev">◀</button><button id="play">❚❚</button><div id="progress"><div id="bar"></div></div><button id="next">▶</button></div><div class="hint">← → 切换 · 空格 播放/暂停</div></div>
<script>
const pages=[{"en": "Look! A rainbow is smiling in the sky.", "zh": "雨刚停，Leo 抬头一看：天空里挂着一条彩色的“微笑”。彩虹常常在太阳和雨滴同时出现时来到我们身边。", "q": "你见过彩虹吗？当时天空是什么样子？", "scene": "after_rain"}, {"en": "Sunlight looks white, but it holds many colors.", "zh": "太阳光看起来白白的，其实里面藏着很多颜色。它们像一群挤在一起的小伙伴，平时我们不容易把它们分开看见。", "q": "你猜白色的太阳光里，藏着哪些颜色？", "scene": "sunlight"}, {"en": "Tiny raindrops catch the sunlight.", "zh": "空气中的小雨滴就像许许多多透明的小玻璃珠。当阳光照进雨滴，神奇的“分色游戏”就开始了。", "q": "如果你是一颗小雨滴，你会把阳光变成什么颜色？", "scene": "droplets"}, {"en": "The light bends as it enters a raindrop.", "zh": "光从空气进入雨滴时，会稍微改变方向，这叫“折射”。就像小车从平滑地面开进软沙地，会拐一下方向。", "q": "你能用手指比一比“直着走”和“拐一下”吗？", "scene": "bend_in"}, {"en": "The colors spread out like a fan.", "zh": "不同颜色的光，拐弯的程度不完全一样。于是原本挤在一起的颜色慢慢分开，像一把彩色的小扇子展开。", "q": "你最想站在这把彩色扇子的哪一种颜色里？", "scene": "separate"}, {"en": "The light bounces inside the raindrop.", "zh": "彩色的光在雨滴里面还会反弹一下，就像小皮球碰到墙又跳回来。这个过程叫“反射”。", "q": "生活中还有什么东西会“弹回来”？", "scene": "reflect"}, {"en": "The colors fly out and reach our eyes.", "zh": "光离开雨滴时又折射一次，然后飞向我们的眼睛。无数雨滴一起把合适角度的彩光送来，我们就看见了彩虹。", "q": "为什么彩虹需要很多很多小雨滴一起帮忙呢？", "scene": "reach_eyes"}, {"en": "Put the Sun behind you and the rain in front.", "zh": "想找彩虹，可以试试这个小秘诀：让太阳在你的身后，雨幕或水雾在你的前方。傍晚或清晨，太阳较低时常更容易观察。", "q": "下次雨后，你准备先朝哪个方向寻找彩虹？", "scene": "position"}, {"en": "A rainbow is really a circle of light.", "zh": "我们在地面上常看到半圆形彩虹，其实完整的彩虹更接近一个圆。只是地面挡住了下面那一部分——天空还藏着很多看不见的惊喜呢！", "q": "如果你坐在高高的飞机上，彩虹可能会变成什么形状？", "scene": "circle"}]; const rainbow=['#f05a59','#f49a3c','#f4d35e','#59b66f','#52a7e8','#6e72d9','#9a63c7'];
const stage=document.getElementById('stage'); let current=0, playing=true, timer=null, DURATION=6500;
function leoSVG(){return `<svg viewBox="0 0 100 150"><rect x="30" y="69" width="40" height="50" rx="12" fill="#ff8c42"/><rect x="31" y="112" width="16" height="31" fill="#2f80ed"/><rect x="53" y="112" width="16" height="31" fill="#2f80ed"/><circle cx="50" cy="52" r="25" fill="#f4b183"/><path d="M25 51a25 26 0 0150 0c-10-13-38-18-50 0" fill="#3e2c27"/><circle cx="41" cy="52" r="2.6" fill="#29313d"/><circle cx="59" cy="52" r="2.6" fill="#29313d"/><path d="M43 62q7 8 14 0" fill="none" stroke="#a34a28" stroke-width="2" stroke-linecap="round"/><path d="M31 83L10 66M69 83L92 58" stroke="#f4b183" stroke-width="8" stroke-linecap="round"/></svg>`}
function dadSVG(){return `<svg viewBox="0 0 110 160"><rect x="27" y="74" width="56" height="66" rx="14" fill="#3ba99c"/><circle cx="55" cy="54" r="29" fill="#f2c29b"/><path d="M27 54a29 30 0 0156 0c-11-14-40-18-56 0" fill="#3a2e2a"/><circle cx="44" cy="54" r="2.8"/><circle cx="66" cy="54" r="2.8"/><path d="M47 66q8 7 16 0" fill="none" stroke="#8a4b2d" stroke-width="2"/><path d="M30 92L8 77M80 92L104 77" stroke="#f2c29b" stroke-width="9" stroke-linecap="round"/></svg>`}
function addDrops(el,n,x0=58,y0=10,w=35,h=48){for(let i=0;i<n;i++){let d=document.createElement('i');d.className='drop';d.style.left=(x0+Math.random()*w)+'%';d.style.top=(y0+Math.random()*h)+'%';d.style.animationDelay=(-Math.random()*1.6)+'s';el.appendChild(d)}}
function addSparkles(el,n=12){for(let i=0;i<n;i++){let s=document.createElement('i');s.className='spark';s.style.left=(4+Math.random()*92)+'%';s.style.top=(7+Math.random()*50)+'%';s.style.animationDelay=(-Math.random()*1.8)+'s';el.appendChild(s)}}
function ray(el,x,y,w,deg,color,delay=0){let r=document.createElement('i');r.className='ray';r.style.left=x+'%';r.style.top=y+'%';r.style.width=w+'%';r.style.transform=`rotate(${deg}deg)`;r.style.background=color;r.style.animationDelay=delay+'s';el.appendChild(r)}
function makeScene(p,i){let s=document.createElement('section');s.className='scene '+(i===0?'active':'');s.innerHTML=`<div class="brand">优米Leo看世界</div><div class="count">${i+1} / ${pages.length}</div><div class="sky bg${i}"></div><div class="textcard"><div class="en">${p.en}</div><div class="zh">${p.zh}</div><div class="q">亲子提问：${p.q}</div></div>`;let sky=s.querySelector('.sky'); addSparkles(sky,10);
 const mk=(cls,css,inner='')=>{let e=document.createElement('div');e.className=cls;e.style.cssText=css;e.innerHTML=inner;sky.appendChild(e);return e};
 if(p.scene==='after_rain'){mk('sun','left:6%;top:8%');mk('cloud','right:15%;top:12%');mk('cloud','right:4%;top:27%;transform:scale(.7)');addDrops(sky,18,68,17,25,40);mk('rainbow','left:34%;bottom:0');mk('leo','left:11%;bottom:1%;width:12%;height:38%',leoSVG());mk('dad','left:20%;bottom:0;width:11%;height:38%',dadSVG())}
 if(p.scene==='sunlight'){mk('sun','left:6%;top:11%');ray(sky,17,26,28,10,'#fff1a8');mk('prism','left:47%;top:29%');rainbow.forEach((c,k)=>ray(sky,57,47,34,-13+k*4,c,k*.1));mk('leo','left:24%;bottom:1%;width:11%;height:36%',leoSVG())}
 if(p.scene==='droplets'){mk('sun','left:5%;top:10%');ray(sky,15,24,37,9,'#fff1a8');addDrops(sky,30,36,4,56,53);mk('leo','left:12%;bottom:0;width:11%;height:35%',leoSVG());mk('bigdrop','left:49%;top:17%;width:14%')}
 if(p.scene==='bend_in'){mk('bigdrop','left:49%;top:11%;width:24%');ray(sky,15,22,35,10,'#fff1a8');ray(sky,48,34,28,35,'#ffd166');mk('leo','left:13%;bottom:0;width:10%;height:34%',leoSVG());mk('','left:67%;top:66%;font-weight:900;color:#2f80ed;font-size:2.2vw','BEND!')}
 if(p.scene==='separate'){mk('bigdrop','left:32%;top:13%;width:19%');ray(sky,9,26,27,10,'#fff1a8');rainbow.forEach((c,k)=>ray(sky,46,43,45,-17+k*5,c,k*.08));mk('leo','left:10%;bottom:0;width:10%;height:34%',leoSVG())}
 if(p.scene==='reflect'){mk('bigdrop','left:43%;top:9%;width:25%');ray(sky,15,22,35,10,'#ff7a59');ray(sky,48,36,25,38,'#ff7a59');ray(sky,60,68,22,-54,'#ff7a59');mk('leo','left:12%;bottom:0;width:10%;height:34%',leoSVG());mk('','left:68%;top:61%;font-weight:900;color:#fff;font-size:2vw','BOUNCE!')}
 if(p.scene==='reach_eyes'){mk('sun','left:4%;top:7%');addDrops(sky,24,38,5,52,50);rainbow.forEach((c,k)=>ray(sky,62,33+k*.8,42,155,c,k*.1));mk('leo','left:13%;bottom:0;width:12%;height:38%',leoSVG())}
 if(p.scene==='position'){mk('sun','left:5%;top:9%');mk('leo','left:43%;bottom:0;width:11%;height:36%',leoSVG());ray(sky,15,24,31,10,'#ffe4a0');addDrops(sky,22,65,8,26,48);mk('rainbow','left:68%;bottom:0;width:27%');mk('','left:4%;top:57%;font-weight:850;color:#684f3d;font-size:1.4vw','SUN BEHIND');mk('','left:69%;top:72%;font-weight:850;color:#684f3d;font-size:1.4vw','RAIN IN FRONT')}
 if(p.scene==='circle'){mk('cloud','left:4%;top:12%');mk('cloud','right:5%;top:13%');mk('cloud','right:21%;top:57%;transform:scale(.65)');mk('circleRainbow','left:42%;top:10%');mk('leo','left:12%;bottom:0;width:10%;height:34%',leoSVG());mk('','left:18%;top:42%;width:20%;height:5%;background:white;border-radius:99px;transform:rotate(4deg);box-shadow:0 5px 12px #9ab7c8','')}
 return s}
pages.forEach((p,i)=>stage.appendChild(makeScene(p,i)));
function show(n){current=(n+pages.length)%pages.length;document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active',i===current));document.getElementById('bar').style.width=((current+1)/pages.length*100)+'%';restart()}
function restart(){clearTimeout(timer);if(playing)timer=setTimeout(()=>show(current+1),DURATION)}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'❚❚':'▶';restart()};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1);if(e.key===' '){e.preventDefault();document.getElementById('play').click()}});show(0);
</script></body></html>
