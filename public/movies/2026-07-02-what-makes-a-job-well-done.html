<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>优米Leo看世界 - 如何才算把一个事情作好了？</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#ffeecf,#fff7eb);color:#4a3a2a;overflow:hidden}.wrap{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.title{font-size:clamp(20px,2.8vw,34px);font-weight:700;margin-bottom:12px;color:#6c4a23;text-align:center}.stage{position:relative;width:min(94vw,1200px);aspect-ratio:1414/1000;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(125,92,42,.22)}.slide{position:absolute;inset:0;opacity:0;transform:scale(1.04);transition:opacity .8s ease,transform 4s ease;background:#fff center/contain no-repeat}.slide.active{opacity:1;transform:scale(1)}.controls{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}button{border:none;background:#f4b64c;color:#5b3e18;padding:10px 16px;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(244,182,76,.28)}button:hover{filter:brightness(1.03)}.info{font-size:15px;color:#7a624b;font-weight:600}.dots{display:flex;gap:7px}.dot{width:10px;height:10px;border-radius:50%;background:#e7cfaa;transition:.3s}.dot.active{background:#f4b64c;transform:scale(1.25)}.sparkle{position:absolute;width:10px;height:10px;background:rgba(255,236,170,.9);clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%);animation:twinkle 3s infinite ease-in-out}@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.2);opacity:1}}
</style></head><body><div class="wrap"><div class="title">优米Leo看世界｜如何才算把一个事情作好了？</div><div class="stage" id="stage"><div class="sparkle" style="left:5%;top:8%;animation-delay:0.0s"></div><div class="sparkle" style="left:86%;top:14%;animation-delay:0.5s"></div><div class="sparkle" style="left:14%;top:78%;animation-delay:1.0s"></div><div class="sparkle" style="left:90%;top:82%;animation-delay:1.5s"></div><div class="sparkle" style="left:50%;top:10%;animation-delay:2.0s"></div><div class="sparkle" style="left:74%;top:64%;animation-delay:2.5s"></div><div class="slide" data-index="0" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_1.png')"></div><div class="slide" data-index="1" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_2.png')"></div><div class="slide" data-index="2" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_3.png')"></div><div class="slide" data-index="3" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_4.png')"></div><div class="slide" data-index="4" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_5.png')"></div><div class="slide" data-index="5" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_6.png')"></div><div class="slide" data-index="6" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_7.png')"></div><div class="slide" data-index="7" style="background-image:url('2026-07-02-what-makes-a-job-well-done_pages/page_8.png')"></div></div><div class="controls"><button id="prev">上一页</button><button id="play">暂停自动播放</button><button id="next">下一页</button><div class="info" id="info"></div><div class="dots" id="dots"></div></div></div><script>
const slides=Array.from(document.querySelectorAll('.slide'));const info=document.getElementById('info');const dotsWrap=document.getElementById('dots');let current=0;let playing=true;let timer;slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>{current=i;render();restart();};dotsWrap.appendChild(d);});const dots=Array.from(document.querySelectorAll('.dot'));function render(){slides.forEach((s,i)=>s.classList.toggle('active',i===current));dots.forEach((d,i)=>d.classList.toggle('active',i===current));info.textContent=`第 ${current+1} / ${slides.length} 页`;}function next(){current=(current+1)%slides.length;render();}function prev(){current=(current-1+slides.length)%slides.length;render();}function restart(){clearInterval(timer);if(playing)timer=setInterval(next,3500);}document.getElementById('next').onclick=()=>{next();restart();};document.getElementById('prev').onclick=()=>{prev();restart();};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'暂停自动播放':'开始自动播放';restart();};render();restart();
</script></body></html>
