<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>优米Leo看世界 - 人需要比较吗？</title>
<style>
:root {
  --bg1: #fff7e8;
  --bg2: #dff6ff;
  --card: rgba(255,255,255,.86);
  --ink: #25364a;
  --muted: #5b6b78;
  --accent: #ff8ab3;
  --accent2: #64c7ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background: radial-gradient(circle at 20% 15%, #fff, transparent 26%), linear-gradient(135deg, var(--bg1), var(--bg2));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}
.app {
  width: min(1120px, 100%);
  background: rgba(255,255,255,.56);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 32px;
  box-shadow: 0 24px 80px rgba(70,80,100,.18);
  overflow: hidden;
  backdrop-filter: blur(10px);
}
.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 14px;
  padding: 18px 24px 10px;
}
.brand {
  display:flex;
  align-items:center;
  gap: 12px;
  font-weight: 800;
  letter-spacing:.3px;
}
.logo {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #ffb7cf, #ffe08a);
  display:grid; place-items:center; box-shadow:0 8px 18px rgba(255,138,179,.28);
}
.title {
  text-align:right;
  font-size: 14px;
  color: var(--muted);
}
.stage {
  position: relative;
  margin: 0 24px 16px;
  border-radius: 28px;
  overflow: hidden;
  background: #fff;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.8);
}
.slide {
  display:none;
  padding: 18px;
}
.slide.active { display:block; animation: fadeIn .55s ease both; }
.illustration {
  border-radius: 24px;
  overflow:hidden;
  background:#fffaf1;
  border: 1px solid rgba(255,255,255,.8);
}
.scene-svg { display:block; width:100%; height:auto; }
.caption {
  margin-top: 14px;
  padding: 18px 20px 20px;
  border-radius: 24px;
  background: var(--card);
  border: 1px solid rgba(255,255,255,.92);
  display:grid;
  gap: 8px;
}
.caption h1 {
  margin:0;
  font-size: clamp(25px, 4vw, 44px);
  line-height:1.08;
  letter-spacing: -.02em;
}
.cn {
  margin:0;
  font-size: clamp(16px, 2.2vw, 23px);
  line-height:1.55;
  color: #3e4e60;
}
.ask {
  margin: 4px 0 0;
  padding: 10px 14px;
  border-radius: 16px;
  background:#fff0d8;
  color:#7a4d25;
  font-size: clamp(14px, 1.8vw, 19px);
}
.controls {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 12px;
  padding: 0 24px 22px;
}
button {
  border:0;
  padding: 12px 18px;
  border-radius: 999px;
  background:#fff;
  color:#31445b;
  font-weight: 700;
  cursor:pointer;
  box-shadow: 0 8px 22px rgba(80,90,110,.12);
}
button.primary { background: linear-gradient(135deg, var(--accent), #ffd36e); color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.12); }
.dots { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
.dot { width:10px; height:10px; border-radius:50%; background:#c6d8e4; transition:.25s; }
.dot.active { width:26px; border-radius:999px; background:var(--accent); }
.progress { height: 6px; background:#e9f2f7; overflow:hidden; }
.bar { height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s linear; }
@keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
@keyframes floaty { 0%,100%{ transform:translateY(0)} 50%{ transform:translateY(-10px)} }
@keyframes bounce { 0%,100%{ transform:translateY(0) scale(1)} 50%{ transform:translateY(-8px) scale(1.02)} }
@keyframes pulse { 0%,100%{ transform:scale(1)} 50%{ transform:scale(1.06)} }
@keyframes sway { 0%,100%{ transform:rotate(-1.5deg)} 50%{ transform:rotate(1.5deg)} }
@keyframes drift { 0%,100%{ transform:translateX(0)} 50%{ transform:translateX(24px)} }
@keyframes twinkle { 0%,100%{ opacity:.5; transform:scale(.88)} 50%{ opacity:1; transform:scale(1.12)} }
@keyframes ropeSwing { 0%,100%{ transform:rotate(-4deg)} 50%{ transform:rotate(4deg)} }
.scene-svg .float { animation: floaty 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .bounce { animation: bounce 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .sway { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
.scene-svg .slow { animation-duration: 5.2s !important; }
.scene-svg .cloud { animation: drift 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .twinkle { animation: twinkle 1.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .rope { animation: ropeSwing 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
.scene-svg .kite { animation: floaty 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .confetti { animation: bounce 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-svg .cloud-heavy { animation: floaty 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@media (max-width: 720px) {
  body { padding: 10px; }
  .header, .controls { padding-left:14px; padding-right:14px; }
  .stage { margin-left: 12px; margin-right:12px; }
  .controls { flex-wrap:wrap; justify-content:center; }
}
</style>
</head>

  <main class="app" aria-label="优米Leo看世界 HTML5 动画绘本">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <header class="header">
      <div class="brand"><div class="logo">⭐</div><div>优米Leo看世界</div></div>
      <div class="title">Do People Need to Compare? / 人需要比较吗？</div>
    </header>
    <section class="stage" id="stage"></section>
    <div class="controls">
      <button id="prev" aria-label="上一页">← 上一页</button>
      <div class="dots" id="dots" aria-label="页码"></div>
      <button id="play" class="primary" aria-label="自动播放">暂停自动播放</button>
      <button id="next" aria-label="下一页">下一页 →</button>
    </div>
  </main>

const stage = document.getElementById('stage');
const dots = document.getElementById('dots');
const bar = document.getElementById('bar');
let index = 0;
let playing = true;
let tick = null;
let progressTimer = null;
const interval = 6500;

function render() {
  stage.innerHTML = slides.map((s, i) => `
    <article class="slide ${i === index ? 'active' : ''}">
      <div class="illustration">${s.svg}</div>
      <div class="caption">
        <h1>${s.english}</h1>
        <p class="cn">${s.chinese}</p>
        <p class="ask">亲子提问：${s.question}</p>
      </div>
    </article>`).join('');
  dots.innerHTML = slides.map((_, i) => `<span class="dot ${i === index ? 'active' : ''}" data-i="${i}"></span>`).join('');
  document.querySelectorAll('.dot').forEach(d => d.onclick = () => go(Number(d.dataset.i)));
  updateBar(0);
}
function updateBar(pct) { bar.style.width = pct + '%'; }
function go(i) {
  index = (i + slides.length) % slides.length;
  render();
  restart();
}
function next() { go(index + 1); }
function prev() { go(index - 1); }
function restart() {
  clearInterval(tick); clearInterval(progressTimer);
  updateBar(0);
  if (!playing) return;
  const start = Date.now();
  tick = setInterval(next, interval);
  progressTimer = setInterval(() => {
    const pct = Math.min(100, ((Date.now() - start) % interval) / interval * 100);
    updateBar(pct);
  }, 120);
}
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('play').onclick = () => {
  playing = !playing;
  document.getElementById('play').textContent = playing ? '暂停自动播放' : '开始自动播放';
  restart();
};
render(); restart();
</script>
