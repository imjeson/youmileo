<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-07-04-discover-what-you-are-good-at</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Noto Sans CJK SC","Noto Sans",sans-serif;background:linear-gradient(180deg,#fff7ef,#ffe9cb 60%,#fff8ef);color:#50351f;overflow:hidden} .app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative} header{padding:14px 16px 8px;text-align:center;z-index:5} header .brand{font-size:18px;color:#c47c28} header h1{margin:6px 0 2px;font-size:34px} header h2{margin:0;font-size:18px;font-weight:500;color:#86674b} .viewer{flex:1;width:min(1000px,92vw);margin:0 auto 16px;position:relative;border-radius:28px;overflow:hidden;background:#fffaf3;box-shadow:0 18px 60px rgba(155,109,50,.18)} .slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s ease} .slide.active{opacity:1;pointer-events:auto} .slide img.bg{width:100%;height:100%;object-fit:cover;animation:zoom 12s ease-in-out infinite alternate} @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.08)}} .overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,245,230,.06) 0%, rgba(255,245,230,.06) 46%, rgba(73,44,16,.15) 70%, rgba(73,44,16,.46) 100%)} .caption{position:absolute;left:24px;right:24px;bottom:24px;background:rgba(255,251,244,.9);border:1px solid rgba(233,205,170,.8);border-radius:24px;padding:20px 24px;box-shadow:0 10px 30px rgba(90,60,20,.12);backdrop-filter:blur(6px);animation:rise .8s ease both} @keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}} .en{font-size:28px;line-height:1.35;font-weight:700;color:#4c3118;margin-bottom:10px} .cn{font-size:20px;line-height:1.72;color:#60452c;margin-bottom:8px} .q{font-size:18px;line-height:1.6;color:#8b5a27} .controls{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10} button{border:none;border-radius:999px;background:#fff7eb;color:#7a4d1d;padding:10px 16px;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(134,93,45,.18)} .page-indicator{position:absolute;top:16px;right:18px;z-index:10;background:rgba(255,249,240,.88);border-radius:999px;padding:8px 14px;color:#8f6641;font-size:15px;box-shadow:0 6px 18px rgba(134,93,45,.12)} .sparkles,.sparkles:before,.sparkles:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 10% 20%, rgba(255,255,255,.9) 0 2px, transparent 3px),radial-gradient(circle at 80% 25%, rgba(255,238,180,.8) 0 2px, transparent 3px),radial-gradient(circle at 30% 70%, rgba(255,255,255,.8) 0 2px, transparent 3px),radial-gradient(circle at 68% 60%, rgba(255,230,160,.7) 0 2px, transparent 3px);animation:twinkle 5s linear infinite;pointer-events:none} .sparkles:before{animation-duration:7s;opacity:.7} .sparkles:after{animation-duration:9s;opacity:.45} @keyframes twinkle{0%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}100%{opacity:.55;transform:translateY(0)}} .dots{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10} .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.65);border:1px solid rgba(190,130,60,.4)} .dot.active{background:#ffb65a} @media (max-width:768px){header h1{font-size:26px}header h2{font-size:15px} .viewer{width:94vw;margin-bottom:10px} .caption{left:14px;right:14px;bottom:14px;padding:16px} .en{font-size:22px} .cn{font-size:16px;line-height:1.6} .q{font-size:15px} .controls{bottom:18px} .dots{bottom:70px} }
</style>
</head>
<body>
<div class="app">
<header><div class="brand">优米Leo看世界</div><h1>如何发现自己擅长什么？</h1><h2>How to Discover What You Are Good At</h2></header>
<div class="viewer" id="viewer"><div class="page-indicator" id="indicator">1 / 8</div><div class="sparkles"></div></div>
<div class="dots" id="dots"></div>
<div class="controls"><button id="prevBtn">上一页</button><button id="playBtn">暂停</button><button id="nextBtn">下一页</button></div>
</div>
<script>
const slides=[{"en": "Everyone is good at something.", "cn": "每个人都有自己擅长的事情。有人爱画画，有人跑得快，也有人特别会观察和思考。", "q": "你觉得自己做什么事情时最开心？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_1.png"}, {"en": "Try many things and see what you like.", "cn": "想发现自己的长处，第一步就是多尝试。画一画、搭一搭、唱一唱、跑一跑，慢慢你就会找到心里最亮的那盏灯。", "q": "你还想试试什么新事情？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_2.png"}, {"en": "Your talent often feels fun.", "cn": "当一件事让你越做越开心，做完还想再来一次，它可能就是你的小天赋在发光。", "q": "什么事情会让你想“一次还不够”？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_3.png"}, {"en": "Practice helps your gift grow.", "cn": "擅长不是一下子就有的。你愿意反复练习、一次比一次做得更好，这也是发现长处的重要信号。", "q": "你最近练习了什么，感觉自己进步了？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_4.png"}, {"en": "Kind words can help you see yourself.", "cn": "爸爸妈妈、老师和朋友的鼓励，有时候会帮你看见自己的优点。别人说“你很细心”或“你很有创意”，都值得记在心里。", "q": "别人夸过你的哪一点？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_5.png"}, {"en": "Mistakes can teach you, too.", "cn": "做不好并不代表你不行。摔倒、拼错、画歪了，都是学习的一部分。愿意继续试的人，常常会走得更远。", "q": "如果第一次没做好，你想怎么再试一次？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_6.png"}, {"en": "A talent can help other people.", "cn": "真正的长处，不只是让自己开心，还能帮助别人。你会搭积木，就能和朋友一起合作；你会讲故事，就能逗别人开心。", "q": "你的本领可以怎样帮助别人？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_7.png"}, {"en": "Keep growing, and your light will shine.", "cn": "发现自己擅长什么，不用着急。多尝试、认真练、勇敢分享，你的小种子会慢慢长成闪亮的大树。", "q": "你想继续培养哪一个小本领？", "image": "2026-07-04-discover-what-you-are-good-at_pages/raw_8.png"}];
const viewer=document.getElementById('viewer');const dots=document.getElementById('dots');const indicator=document.getElementById('indicator');let index=0;let playing=true;let timer=null;
slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(i===0?' active':'');el.innerHTML=`<img class="bg" src="${s.image}" alt="slide-${i+1}"><div class="overlay"></div><div class="caption"><div class="en">${s.en}</div><div class="cn">${s.cn}</div><div class="q">亲子提问：${s.q}</div></div>`;viewer.appendChild(el);const dot=document.createElement('div');dot.className='dot'+(i===0?' active':'');dot.addEventListener('click',()=>go(i,true));dots.appendChild(dot);});
const slideEls=[...document.querySelectorAll('.slide')];const dotEls=[...document.querySelectorAll('.dot')];
function render(){slideEls.forEach((el,i)=>el.classList.toggle('active',i===index));dotEls.forEach((el,i)=>el.classList.toggle('active',i===index));indicator.textContent=`${index+1} / ${slides.length}`;}
function go(i,reset=false){index=(i+slides.length)%slides.length;render();if(reset)restart();}
function next(reset=true){go(index+1,reset)} function prev(reset=true){go(index-1,reset)}
function restart(){clearInterval(timer); if(playing) timer=setInterval(()=>next(false),5000);}
document.getElementById('nextBtn').addEventListener('click',()=>next(true)); document.getElementById('prevBtn').addEventListener('click',()=>prev(true)); document.getElementById('playBtn').addEventListener('click',(e)=>{playing=!playing; e.target.textContent=playing?'暂停':'播放'; restart();});
render(); restart();
</script>
</body></html>
