<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>优米Leo看世界｜世界上最大的鱼是什么？</title>
  <style>
    :root {
      --ocean1: #7dd3fc;
      --ocean2: #0ea5e9;
      --deep: #0369a1;
      --sand: #fde68a;
      --white: #ffffff;
      --ink: #0f172a;
      --card: rgba(255,255,255,.82);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 40%, #38bdf8 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .stage {
      width: min(100vw, 1180px);
      height: min(100vh, 720px);
      aspect-ratio: 16/9;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.7), transparent 18%),
        linear-gradient(180deg, #93c5fd 0%, #38bdf8 42%, #0369a1 100%);
      box-shadow: 0 30px 90px rgba(2, 6, 23, .25);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 18px, transparent 18px 80px);
      animation: lightMove 9s linear infinite;
      pointer-events: none;
    }
    @keyframes lightMove { from { transform: translateX(-80px); } to { transform: translateX(80px); } }
    .bubble {
      position: absolute;
      bottom: -80px;
      border: 2px solid rgba(255,255,255,.7);
      border-radius: 999px;
      opacity: .6;
      animation: bubbleUp linear infinite;
    }
    @keyframes bubbleUp {
      0% { transform: translateY(0) scale(.8); opacity: 0; }
      15% { opacity: .65; }
      100% { transform: translateY(-850px) scale(1.3); opacity: 0; }
    }
    .seaweed {
      position: absolute;
      bottom: -8px;
      width: 26px;
      height: 130px;
      background: linear-gradient(180deg, #34d399, #047857);
      border-radius: 80% 20% 0 0;
      transform-origin: bottom center;
      animation: sway 3.2s ease-in-out infinite alternate;
      opacity: .75;
    }
    .seaweed:nth-child(odd) { height: 95px; animation-duration: 4s; }
    @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
    .sand {
      position: absolute;
      left: -5%; right: -5%; bottom: -42px;
      height: 120px;
      background: radial-gradient(circle at 10% 20%, #fef3c7 0 20px, transparent 21px),
                  radial-gradient(circle at 55% 10%, #fde68a 0 28px, transparent 29px),
                  linear-gradient(180deg, #fde68a, #f59e0b);
      border-radius: 50% 50% 0 0;
    }
    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity .7s ease, transform .7s ease;
      pointer-events: none;
    }
    .scene.active { opacity: 1; transform: scale(1); pointer-events: auto; }
    .caption {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      width: min(86%, 900px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 24px;
      padding: 18px 26px;
      text-align: center;
      box-shadow: 0 16px 38px rgba(15, 23, 42, .16);
      backdrop-filter: blur(10px);
    }
    .caption .en { font-size: clamp(26px, 3.4vw, 44px); font-weight: 850; letter-spacing: .3px; }
    .caption .cn { margin-top: 8px; font-size: clamp(18px, 2vw, 28px); color: #075985; font-weight: 700; }
    .titleBadge {
      position: absolute;
      top: 28px;
      left: 34px;
      z-index: 20;
      background: rgba(255,255,255,.8);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 18px;
      font-weight: 800;
      color: #075985;
      box-shadow: 0 12px 30px rgba(15,23,42,.12);
    }
    .progress {
      position: absolute;
      top: 32px;
      right: 34px;
      z-index: 20;
      width: 190px;
      height: 12px;
      background: rgba(255,255,255,.45);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.75);
    }
    .bar { height: 100%; width: 0%; background: rgba(255,255,255,.9); border-radius: 999px; transition: width .3s; }
    .controls {
      position: absolute;
      right: 34px;
      bottom: 34px;
      z-index: 30;
      display: flex;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(255,255,255,.9);
      color: #075985;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15,23,42,.18);
    }
    button:hover { transform: translateY(-1px); }
    .whale {
      position: absolute;
      width: 420px;
      height: 168px;
      left: 52%; top: 36%;
      transform: translate(-50%, -50%);
      animation: swim 5.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 20px 22px rgba(2,6,23,.2));
    }
    @keyframes swim { from { transform: translate(-52%, -51%) rotate(-1deg); } to { transform: translate(-47%, -48%) rotate(1.2deg); } }
    .body {
      position: absolute;
      width: 340px;
      height: 138px;
      left: 36px; top: 16px;
      background: linear-gradient(180deg, #1e3a8a, #075985 60%, #7dd3fc 61%, #dbeafe);
      border-radius: 54% 46% 45% 55%;
    }
    .mouth {
      position: absolute;
      left: 6px; top: 60px;
      width: 68px; height: 34px;
      background: rgba(15,23,42,.22);
      border-radius: 0 0 70px 70px;
    }
    .tail {
      position: absolute;
      right: 0; top: 43px;
      width: 86px; height: 80px;
      transform-origin: left center;
      animation: tail 1.1s ease-in-out infinite alternate;
    }
    .tail::before, .tail::after {
      content: "";
      position: absolute;
      left: 0;
      width: 80px; height: 42px;
      background: #075985;
      border-radius: 80% 10% 70% 20%;
    }
    .tail::before { top: 0; transform: rotate(-28deg); }
    .tail::after { bottom: 0; transform: rotate(28deg); }
    @keyframes tail { from { transform: rotate(-4deg); } to { transform: rotate(6deg); } }
    .fin {
      position: absolute;
      width: 82px; height: 48px;
      left: 200px; top: 118px;
      background: #0e7490;
      border-radius: 20% 90% 70% 80%;
      transform: rotate(12deg);
    }
    .eye {
      position: absolute;
      left: 68px; top: 46px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      box-shadow: inset 5px -2px 0 #0f172a;
    }
    .spot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.85); }
    .fish {
      position: absolute;
      width: 70px; height: 36px;
      background: #facc15;
      border-radius: 60% 45% 45% 60%;
      animation: fishSwim 8s linear infinite;
      filter: drop-shadow(0 7px 8px rgba(15,23,42,.18));
    }
    .fish::after {
      content: "";
      position: absolute;
      right: -22px; top: 6px;
      border-left: 26px solid #f59e0b;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
    }
    @keyframes fishSwim { from { transform: translateX(-160px); } to { transform: translateX(1260px); } }
    .submarine {
      position: absolute;
      width: 250px;
      height: 112px;
      left: 12%; top: 36%;
      animation: subFloat 3.2s ease-in-out infinite alternate;
    }
    @keyframes subFloat { from { transform: translateY(-8px); } to { transform: translateY(10px); } }
    .subBody { position: absolute; inset: 28px 10px 12px 10px; background: #facc15; border-radius: 80px; box-shadow: inset 0 -16px 0 rgba(180,83,9,.18); }
    .window { position: absolute; top: 44px; width: 42px; height: 42px; background: #bae6fd; border: 5px solid #0ea5e9; border-radius: 50%; }
    .leo { position: absolute; top: 35px; left: 84px; width: 64px; height: 64px; background: #fed7aa; border-radius: 50%; border: 5px solid #f97316; text-align:center; line-height:56px; font-size:30px; }
    .periscope { position: absolute; left: 110px; top: 0; width: 54px; height: 44px; border-left: 16px solid #facc15; border-top: 16px solid #facc15; border-radius: 18px 0 0 0; }
    .propeller { position: absolute; right: -2px; top: 58px; width: 28px; height: 28px; background: #f97316; border-radius:50%; }
    .plankton { position:absolute; width: 8px; height:8px; border-radius:50%; background:#fef08a; animation: drift 3s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateY(-8px); opacity:.5; } to { transform: translateY(8px); opacity:1; } }
    .heart { position:absolute; font-size:70px; animation: pop 1.4s ease-in-out infinite alternate; filter: drop-shadow(0 10px 10px rgba(15,23,42,.2)); }
    @keyframes pop { from { transform: scale(.92); } to { transform: scale(1.08); } }
    .sun { position:absolute; left: 78%; top: 12%; width: 120px; height: 120px; border-radius:50%; background: radial-gradient(circle, #fff7ed, #facc15); box-shadow: 0 0 80px rgba(250,204,21,.55); animation: glow 2.8s ease-in-out infinite alternate; }
    @keyframes glow { from { transform: scale(.95); opacity:.85; } to { transform: scale(1.06); opacity:1; } }
    .bigWord { position:absolute; left:50%; top:22%; transform:translateX(-50%); font-size: clamp(44px, 8vw, 100px); font-weight:950; color:rgba(255,255,255,.9); text-shadow:0 12px 28px rgba(15,23,42,.2); }
    @media (max-width: 700px) {
      .stage { border-radius: 0; height: 100vh; width: 100vw; }
      .titleBadge { font-size: 14px; top: 14px; left: 14px; }
      .progress { top: 18px; right: 14px; width: 120px; }
      .controls { right: 14px; bottom: 12px; }
      .caption { bottom: 72px; padding: 14px; }
      .whale { width: 330px; transform: translate(-50%,-50%) scale(.85); }
      .submarine { transform: scale(.78); left: 2%; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="titleBadge">优米Leo看世界 · Whale Shark</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="sand"></div>
    <div class="seaweed" style="left:8%"></div><div class="seaweed" style="left:16%"></div><div class="seaweed" style="left:84%"></div><div class="seaweed" style="left:91%"></div>

    <section class="scene active" data-en="What is the biggest fish in the world?" data-cn="世界上最大的鱼是什么？">
      <div class="submarine"><div class="periscope"></div><div class="subBody"></div><div class="leo">👦</div><div class="window" style="left:48px"></div><div class="window" style="left:152px"></div><div class="propeller"></div></div>
      <div class="bigWord">?</div>
    </section>

    <section class="scene" data-en="It is the whale shark!" data-cn="答案是鲸鲨！">
      <div class="whale whaleMain"></div>
      <div class="bigWord" style="top:18%; font-size:64px;">Whale Shark</div>
    </section>

    <section class="scene" data-en="A whale shark is a fish, not a whale." data-cn="鲸鲨是鱼，不是鲸鱼。">
      <div class="bigWord" style="font-size:74px; top:16%;">FISH</div>
      <div class="whale whaleMain" style="top:45%; left:46%; transform:scale(.85);"></div>
      <div style="position:absolute;left:66%;top:38%;font-size:90px;">🐟</div>
    </section>

    <section class="scene" data-en="It swims slowly like a gentle giant." data-cn="它像温柔的大巨人，慢慢游。">
      <div class="whale whaleMain" style="width:520px; top:40%; left:48%;"></div>
      <div class="heart" style="left:74%;top:24%;">💙</div>
    </section>

    <section class="scene" data-en="Its body is full of white spots." data-cn="它身上有很多白色小斑点。">
      <div class="whale whaleMain" style="width:560px; top:42%; left:50%;"></div>
      <div class="bigWord" style="top:16%; font-size:54px;">Spots like stars</div>
    </section>

    <section class="scene" data-en="It opens its big mouth to eat tiny food." data-cn="它张开大嘴，吃很小的食物。">
      <div class="whale whaleMain" style="width:540px; top:43%; left:45%;"></div>
      <div id="planktonField"></div>
    </section>

    <section class="scene" data-en="Little fish can swim near its side." data-cn="小鱼喜欢在它身边游。">
      <div class="whale whaleMain" style="width:510px; top:42%; left:46%;"></div>
      <div class="fish" style="top:31%; left:8%; animation-duration:7s;"></div>
      <div class="fish" style="top:46%; left:0%; animation-duration:9s; background:#fb7185;"></div>
      <div class="fish" style="top:58%; left:4%; animation-duration:8s; background:#a3e635;"></div>
    </section>

    <section class="scene" data-en="Whale sharks like warm ocean water." data-cn="鲸鲨喜欢温暖的海水。">
      <div class="sun"></div>
      <div class="whale whaleMain" style="width:470px; top:50%; left:44%;"></div>
    </section>

    <section class="scene" data-en="We can love the ocean and protect it." data-cn="我们可以爱护海洋，保护鲸鲨。">
      <div class="whale whaleMain" style="width:440px; top:44%; left:44%;"></div>
      <div class="heart" style="left:63%;top:28%;">💙</div>
      <div class="heart" style="left:76%;top:42%;font-size:48px;">🌊</div>
    </section>

    <div class="caption"><div class="en" id="enText"></div><div class="cn" id="cnText"></div></div>
    <div class="controls"><button id="prevBtn">上一页</button><button id="playBtn">暂停</button><button id="nextBtn">下一页</button></div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const scenes = [...document.querySelectorAll('.scene')];
    const enText = document.getElementById('enText');
    const cnText = document.getElementById('cnText');
    const bar = document.getElementById('bar');
    const playBtn = document.getElementById('playBtn');
    let idx = 0;
    let playing = true;
    let timer = null;
    const sceneSeconds = 5.2;

    function makeWhale(el) {
      el.innerHTML = '<div class="body"><div class="mouth"></div><div class="eye"></div><div class="fin"></div></div><div class="tail"></div>';
      const body = el.querySelector('.body');
      const spots = [
        [105,32],[137,48],[170,30],[205,58],[245,38],[282,66],[118,76],[158,88],[198,82],[236,98],[278,92],[310,52],[88,98]
      ];
      spots.forEach(([x,y],i)=>{
        const s=document.createElement('span'); s.className='spot'; s.style.left=x+'px'; s.style.top=y+'px'; s.style.width=(8+i%3*3)+'px'; s.style.height=s.style.width; body.appendChild(s);
      });
    }
    document.querySelectorAll('.whaleMain').forEach(makeWhale);

    for(let i=0;i<26;i++){
      const b=document.createElement('div'); b.className='bubble';
      const size=8+Math.random()*34; b.style.width=size+'px'; b.style.height=size+'px';
      b.style.left=(Math.random()*100)+'%'; b.style.animationDuration=(6+Math.random()*9)+'s'; b.style.animationDelay=(-Math.random()*9)+'s';
      stage.appendChild(b);
    }
    const pf = document.getElementById('planktonField');
    for(let i=0;i<42;i++){
      const p=document.createElement('div'); p.className='plankton';
      p.style.left=(48+Math.random()*25)+'%'; p.style.top=(30+Math.random()*28)+'%'; p.style.animationDelay=(Math.random()*2)+'s';
      pf.appendChild(p);
    }

    function render(){
      scenes.forEach((s,i)=>s.classList.toggle('active', i===idx));
      enText.textContent=scenes[idx].dataset.en;
      cnText.textContent=scenes[idx].dataset.cn;
      bar.style.width=((idx+1)/scenes.length*100)+'%';
    }
    function next(){ idx=(idx+1)%scenes.length; render(); }
    function prev(){ idx=(idx-1+scenes.length)%scenes.length; render(); }
    function start(){ clearInterval(timer); timer=setInterval(next, sceneSeconds*1000); }
    document.getElementById('nextBtn').onclick=()=>{ next(); if(playing) start(); };
    document.getElementById('prevBtn').onclick=()=>{ prev(); if(playing) start(); };
    playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'暂停':'播放'; if(playing) start(); else clearInterval(timer); };
    document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key===' ') playBtn.click(); });
    render(); start();
  </script>
</body>
</html>
